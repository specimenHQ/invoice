<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:100%;height:100%;background:#000;overflow:hidden;
   -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
   touch-action:none;font-family:'IV-dot',ui-monospace,monospace}
 canvas{position:fixed;inset:0;display:block}
 #hud{position:fixed;left:2vmin;top:1.4vmin;color:#fff;opacity:.32;
   font-size:1.8vmin;letter-spacing:.14em;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="hud">p50 — tap, then turn the device</div>
<script>
/* ============================================================
   PAGE 50 — the collapse.

   The reader has spent 45 pages acquiring a language. Here the page
   itself stops holding it up: every character becomes a body, gravity
   arrives with the turn of the device, and what the characters strike
   on the way down takes their identity from them. What settles is 0s
   and 1s, because that is all that survives being dropped.

   The gate is the turn. It cannot be tapped through — the reader's
   posture has to change, not their finger. Nothing says so; they were
   taught this at the start of the book and never told again.

   The gate keys off the TILT SENSOR, not the viewport: a phone with
   rotation lock on never re-lays-out, and that reader must not be
   stranded.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d'), hud=document.getElementById('hud');
let W=0,H=0,cell=0;

function size(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(d,0,0,d,0,0);
  cell=Math.max(9,Math.round(Math.min(W,H)/44));
}
size(); addEventListener('resize',()=>{size();});

/* ---- gravity, from the device ------------------------------- */
let gAng=0, haveTilt=false, shownAng=0, lastT=0;
function screenAngle(){
  if (screen.orientation && typeof screen.orientation.angle==='number')
    return screen.orientation.angle*Math.PI/180;
  if (typeof window.orientation==='number') return window.orientation*Math.PI/180;
  return 0;
}
addEventListener('deviceorientation', e=>{
  if(e.gamma===null||e.beta===null) return;
  haveTilt=true;
  const b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180;
  let a=Math.atan2(Math.sin(g), -Math.sin(b)*Math.cos(g)) - screenAngle();
  while(a> Math.PI) a-=Math.PI*2;
  while(a<-Math.PI) a+=Math.PI*2;
  gAng=a;
}, true);

/* how far the device has turned from upright, 0..1 */
function turned(){ return Math.min(1, Math.abs(Math.sin(shownAng))); }

/* ---- the characters, as bodies ------------------------------ */
const VOCAB=".,:;-_!?0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const parts=[];
function build(){
  parts.length=0;
  const cols=Math.floor(W/cell)-1, rows=Math.floor(H/(cell*1.15))-1;
  for(let ry=0; ry<rows; ry++){
    for(let rx=0; rx<cols; rx++){
      // the page as the reader left it: dense to the right, per the law
      const u=rx/cols;
      if (Math.random() > 0.22+0.55*u) continue;
      parts.push({
        x:(rx+1)*cell, y:(ry+1)*cell*1.15, vx:0, vy:0,
        ch:VOCAB[(Math.random()*VOCAB.length)|0],
        id:1,                       // how much of itself it still is
        bit:Math.random()<0.5?'0':'1',
        r:cell*0.46, rest:0, woke:0
      });
    }
  }
}

/* ---- collisions ---------------------------------------------
   A spatial hash, so each body only tests against its neighbours.
   Testing every pair would be 200,000 tests a frame at this count. */
const grid=new Map();
function key(i,j){ return i+','+j; }
function hash(){
  grid.clear();
  const s=cell;
  for(const p of parts){
    const k=key(Math.floor(p.x/s), Math.floor(p.y/s));
    let a=grid.get(k); if(!a){ a=[]; grid.set(k,a); }
    a.push(p);
  }
}
function neighbours(p){
  const s=cell, i=Math.floor(p.x/s), j=Math.floor(p.y/s), out=[];
  for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
    const a=grid.get(key(i+di,j+dj)); if(a) out.push(...a);
  }
  return out;
}

let running=false, started=0, settledAt=0;

function step(dt){
  // dt is used by the loss above
  const k=turned();
  // gravity arrives WITH the turn — upright, nothing falls
  const g = 820*k;
  const gx=Math.sin(shownAng)*g, gy=Math.cos(shownAng)*g;

  for(const p of parts){
    p.vx+=gx*dt; p.vy+=gy*dt;

    // Friction rises sharply once a body is slow. Without this a pile never
    // stops — it creeps for ever on the residue of its own collisions.
    const sp=Math.hypot(p.vx,p.vy);
    // Heavy damping ONLY near rest. Applying it across a wide speed band
    // sets a terminal velocity — at 0.80 below 150 the algebra caps every
    // body at about 52 px/s, which is too slow to lose identity and too
    // fast to fall asleep. One number was suppressing both behaviours.
    const damp = sp < 45 ? 0.86 : 0.995;
    p.vx*=damp; p.vy*=damp;

    // rest detection: a body that has been slow for a while is asleep.
    // without this a deep pile churns for ever on its own contact noise.
    // A body can only fall asleep if it has been awake. Checking speed
    // alone deadlocks: everything starts at rest, so everything sleeps
    // before gravity has a chance to move it.
    if (sp > 110) p.woke = 1;
    if (p.woke && sp < 62){ p.rest++; if(p.rest>10){ p.vx=0; p.vy=0; } }
    else p.rest=0;

    // what tumbling costs
    if (sp > LOSS_MIN && p.id > 0){
      p.id -= LOSS_RATE * dt * Math.min(1.6, sp/240);
      if (p.id < 0) p.id = 0;
    }

    p.x+=p.vx*dt; p.y+=p.vy*dt;

    // the walls of the device
    const b=0.18;                       // bounce, almost none
    if(p.x<p.r){ p.x=p.r; p.vx=-p.vx*b; }
    if(p.x>W-p.r){ p.x=W-p.r; p.vx=-p.vx*b; }
    if(p.y<p.r){ p.y=p.r; p.vy=-p.vy*b; }
    if(p.y>H-p.r){ p.y=H-p.r; p.vy=-p.vy*b; }
  }

  hash();
  for(const p of parts){
    for(const q of neighbours(p)){
      if(q===p) continue;
      const dx=q.x-p.x, dy=q.y-p.y;
      const d2=dx*dx+dy*dy, rr=p.r+q.r;
      if(d2>=rr*rr || d2<1e-6) continue;
      const d=Math.sqrt(d2), n=(rr-d)/d*0.5;
      p.x-=dx*n; p.y-=dy*n; q.x+=dx*n; q.y+=dy*n;
      const rvx=q.vx-p.vx, rvy=q.vy-p.vy;
      const imp=(rvx*dx+rvy*dy)/d*0.42;
      p.vx+=dx/d*imp*0.32; p.vy+=dy/d*imp*0.32;
      q.vx-=dx/d*imp*0.32; q.vy-=dy/d*imp*0.32;
    }
  }
}

/* Collision impulses turned out to be a poor signal — too spiky, too
   dependent on how deep a body sits in the pile. Identity is spent by
   MOTION instead: a character loses itself while it is tumbling, and
   keeps whatever is left once it comes to rest.

   Same reading, far easier to pace — and the pacing is the point, because
   the reader should watch the alphabet die rather than find it dead. */
function lose(){}                                  // no longer used

const LOSS_RATE = 0.30;     // identity per second at full tumble
const LOSS_MIN  = 70;       // below this speed, nothing is lost

function draw(t){
  requestAnimationFrame(draw);
  const dt=Math.min(0.032,(t-lastT)/1000)||0.016; lastT=t;

  // ease the sensor, on a time constant so 60Hz and 120Hz agree
  const target = haveTilt ? gAng : (W>H ? Math.PI/2 : 0);
  let d=target-shownAng;
  while(d> Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  shownAng += d*(1-Math.exp(-dt*1000/95));

  if(running) step(dt);

  x.clearRect(0,0,W,H);
  x.font=cell+'px "IV-dot",ui-monospace,monospace';
  x.textAlign='center'; x.textBaseline='middle';

  let stillLanguage=0, moving=0;
  for(const p of parts){
    // identity decides which character it still is
    const isWord = p.id > 0.5;
    if(isWord) stillLanguage++;
    if(Math.hypot(p.vx,p.vy)>18) moving++;
    const ch = isWord ? p.ch : p.bit;
    const a = (0.30+0.70*(p.x/W)) * (isWord ? 0.55+0.45*p.id : 0.92);
    x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
    x.fillText(ch, p.x, p.y);
  }

  const k=turned();
  hud.textContent='p50  '+(haveTilt?'tilt':'no-tilt')
    +'  turned '+k.toFixed(2)
    +'  language '+Math.round(100*stillLanguage/Math.max(1,parts.length))+'%'
    +'  moving '+moving;
}

function start(){
  if(running) return;
  size(); build(); running=true; started=performance.now();
  const go=()=>{};
  if (typeof DeviceOrientationEvent!=='undefined' &&
      typeof DeviceOrientationEvent.requestPermission==='function')
    DeviceOrientationEvent.requestPermission().then(go).catch(go);
}
requestAnimationFrame(draw);
addEventListener('touchend',e=>{e.preventDefault(); running?0:start();});
addEventListener('click',()=>{ running?0:start(); });
</script></body></html>
