<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:100%;height:100%;background:#000;overflow:hidden;
   -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
   touch-action:none;font-family:'IV-dot',ui-monospace,monospace}
 canvas{position:fixed;inset:0;display:block}
 #hud{position:fixed;left:0;right:0;bottom:2vmin;text-align:center;color:#fff;
   opacity:.22;font-size:1.6vmin;letter-spacing:.3em;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="hud">TAP TO REPLAY</div>
<script>
/* ============================================================
   The first word is not written. It is collided into being.

   The page is half N and half 0. The two halves advance on each
   other — slowly, so the reader has time to see what is coming
   before it arrives. Where they meet, they burst, and the burst is
   made of the same two characters and nothing else.

   Then black. Then NO fades up, having already happened.

   N comes from the dark side and 0 from the light side, so they
   arrive in reading order. And the O is a 0 — the word is one
   letter and one digit, half language and half binary, which is the
   state of the whole book at this point.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d'), hud=document.getElementById('hud');
let W=0,H=0,cell=0,cols=0,rows=0,seed=null;

/* ---- the crate, at the centre --------------------------------
   The two halves close ON the box — the refusal converging on the
   thing being refused — and the burst comes out of it because that
   is where they met. Same box as pages 28-29, ray-cast the same way.
   ------------------------------------------------------------- */
const RAMP=" .,-~:_;!I|/1TL7JY?FVCZS3AXK2UP0O548EG9H6RDQBNWM";
/* Same view as before — only the projection is fixed. The vertical scale
   was 0.9 of the horizontal, which squashed a true cube into a box. A cube
   in geometry still reads as a box if the projection is not isotropic. */
const A=0.34, B=0.62, BOXR=0.115;   // the original view, unchanged
function rayDir(){
  const ca=Math.cos(A),sa=Math.sin(A),cb=Math.cos(B),sb=Math.sin(B);
  return [-ca*sb, sa, ca*cb];
}
function rayOrigin(X,Y){
  const ca=Math.cos(A),sa=Math.sin(A),cb=Math.cos(B),sb=Math.sin(B);
  const d=-4, j=Y*ca+d*sa, z1=-Y*sa+d*ca;
  return [X*cb-z1*sb, j, X*sb+z1*cb];
}
function hitBox(o,dir,h){
  let tmin=-1e9,tmax=1e9,axis=0,sign=1;
  for(let n=0;n<3;n++){
    if(Math.abs(dir[n])<1e-9){ if(o[n]<-h||o[n]>h) return null; continue; }
    let t1=(-h-o[n])/dir[n], t2=(h-o[n])/dir[n], sg=-1;
    if(t1>t2){const tt=t1;t1=t2;t2=tt;sg=1;}
    if(t1>tmin){tmin=t1;axis=n;sign=sg;}
    if(t2<tmax) tmax=t2;
    if(tmin>tmax) return null;
  }
  return [tmin,axis,sign];
}
function crateAt(X,Y){
  const h=hitBox(rayOrigin(X,Y),rayDir(),1);
  if(!h) return -1;
  const axis=h[1], sign=h[2];
  if(axis===1) return sign<0?0.90:0.30;      // lid / floor
  if(axis===2) return 0.48;                  // front, back
  return 0.25;                               // sides
}

function size(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(d,0,0,d,0,0);
  cell=Math.max(8,Math.round(Math.min(W,H)/48));
  cols=Math.ceil(W/cell)+1; rows=Math.ceil(H/(cell*1.15))+1;
  seed=new Float32Array(cols*rows);
  for(let i=0;i<seed.length;i++)
    seed[i]=Math.abs(Math.sin(i*12.9898)*43758.5453)%1;
}
size(); addEventListener('resize',size);

/* ---- timing --------------------------------------------------
   The approach is long on purpose: the reader should watch it
   coming. The burst is short. The word arrives last and stays. */
/* No black between the burst and the word. The field never goes away —
   it settles out of the burst into a mix, and the word comes up on the
   same screen. Cutting to black and back made them two events; this
   makes them one. */
const T={ hold:900, close:9000, burst:2600, dark:0, word:4200 };
const TOTAL=T.hold+T.close+T.burst+T.dark+T.word;
let t0=0;

/* rays for the burst — uneven, gapped, starting away from centre */
const RAYS=[];
(function(){
  const N=46;
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2 + Math.sin(i*12.9898)*0.06;
    RAYS.push({a, len:0.25+1.25*Math.pow(Math.abs(Math.sin(i*2.7+0.4)),0.6),
               w:0.30+0.70*Math.abs(Math.sin(i*5.1+2)),
               sp:0.7+0.6*Math.abs(Math.sin(i*1.7))});
  }
})();

function draw(t){
  requestAnimationFrame(draw);
  if(!t0) t0=t;
  let age=(t-t0)%TOTAL;

  x.clearRect(0,0,W,H);
  x.font=cell+'px "IV-dot",ui-monospace,monospace';
  x.textAlign='center'; x.textBaseline='middle';
  const cx=W*0.5, cy=H*0.5;

  // --- phase 1: the two halves close on each other
  let close=0;
  if(age>T.hold) close=Math.min(1,(age-T.hold)/T.close);
  const eased=close*close*(3-2*close);          // slow at both ends

  const inBurst = age > T.hold+T.close && age <= T.hold+T.close+T.burst;
  const bAge = inBurst ? (age-T.hold-T.close)/T.burst : 0;
  const afterBurst = age > T.hold+T.close+T.burst;
  const wordStart = T.hold+T.close+T.burst;
  const wordAge = age > wordStart ? (age-wordStart)/T.word : 0;

  // the mixed field comes up UNDER the burst, so nothing ever cuts to black
  const mixIn = age > T.hold+T.close+T.burst*0.45
    ? Math.min(1,(age-(T.hold+T.close+T.burst*0.45))/(T.burst*0.7)) : 0;

  /* ONE field, drawn every frame, start to finish. The cells that sweep
     in are the same cells that mix, and the same cells the word comes up
     over. Nothing is ever replaced — before, the mix was a second field
     that arrived after the first was discarded, and that reads as a cut
     however it is faded. */
  {
    const gap = 0.5 - 0.56*eased;               // negative: they overlap
    const boxHalf = BOXR*0.62;                  // they close ON the crate
    // after the collision each cell forgets which half it came from, on
    // its own clock, so the sorting dissolves rather than switching
    const scramble = afterBurst
      ? Math.min(1,(age-(T.hold+T.close+T.burst*0.4))/(T.burst*1.1)) : 0;

    x.font=cell+'px "IV-dot",ui-monospace,monospace';
    for(let j=0;j<rows;j++){
      const py=j*cell*1.15;
      for(let i=0;i<cols;i++){
        const k=i+j*cols, u=i/(cols-1);

        let side;
        const inN = u < 0.5-gap, inO = u > 0.5+gap;
        if(inN && inO) side = (seed[k] < 0.5) ? -1 : 1;   // the overlap
        else if(inN)  side = -1;
        else if(inO)  side = 1;
        else if(!afterBurst) continue;                    // not yet arrived
        else side = (seed[k] < 0.5) ? -1 : 1;

        if(scramble > 0){
          const own = (seed[k]*7.13 + age*0.00055*(0.4+seed[k]))%1;
          if (own < scramble*0.5) side = -side;
        }

        let a=(0.14+0.52*seed[k])*(0.30+0.70*u);
        if(!afterBurst){
          const edge = side<0 ? (u/(0.5-gap+1e-6)) : ((1-u)/(0.5-gap+1e-6));
          a *= 0.45 + 0.55*eased + 0.5*Math.pow(Math.max(0,edge),6)*eased;
        } else {
          a *= 0.55 + 0.25*Math.sin(age*0.0016 + seed[k]*20);
        }
        if(a<0.02) continue;
        x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
        x.fillText(side<0?'N':'0', i*cell, py);
      }
    }
  }

  // the crate — present from the start, whitening as the light leaves it
  {
    const blow = inBurst ? Math.pow(bAge,0.5) : (afterBurst ? 1 : 0);
    const vis  = afterBurst ? Math.max(0,1-(age-(T.hold+T.close+T.burst))/1400) : 1;
    if (vis>0.02){
      x.font=cell+'px "IV-dot",ui-monospace,monospace';
      const S=Math.min(W,H)*BOXR;
      for(let j=0;j<rows;j++){
        const py=j*cell*1.15;
        for(let i=0;i<cols;i++){
          const pxx=i*cell;
          const cA=crateAt((pxx-cx)/S,(py-cy)/S);   // square: same scale both ways
          if(cA<0) continue;
          const a=Math.min(1, cA*0.9 + blow*0.9)*vis*(0.45+0.55*(pxx/W));
          if(a<0.02) continue;
          const g=RAMP[Math.min(RAMP.length-1,Math.round(a*(RAMP.length-1)))];
          x.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
          x.fillText(g,pxx,py);
        }
      }
    }
  }

  // --- phase 2: they meet, and burst — in N and 0 only
  if(inBurst){
    const k=Math.pow(bAge,0.6), fade=1-Math.pow(bAge,2.2);
    const R0=Math.hypot(W,H)*0.5, start=cell*1.2;
    for(const r of RAYS){
      const reach=start+R0*r.len*k*r.sp;
      const ca=Math.cos(r.a), sa=Math.sin(r.a);
      for(let d=start; d<reach; d+=cell*0.72){
        const px=cx+ca*d, py=cy+sa*d*0.92;
        if(px<-cell||px>W+cell||py<-cell||py>H+cell) continue;
        const along=(d-start)/Math.max(1,reach-start);
        let a=Math.pow(1-along,1.15)*r.w*fade*(0.45+0.55*(px/W));
        if(a<0.025) continue;
        x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
        // the burst is made of the two characters that caused it
        x.fillText(((d/cell)|0)%2 ? 'N':'0', px, py);
      }
    }
    const cr=cell*(1.2+6*k);
    const gr=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(1,cr));
    gr.addColorStop(0,'rgba(255,255,255,'+(0.95*fade).toFixed(3)+')');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gr; x.fillRect(0,0,W,H);
  }

  // --- phase 3: black, then the word, having already happened
  if(wordAge>0){
    // It does not simply appear — it comes toward you, out of black and
    // out of nothing, and keeps growing. A word that arrives at a fixed
    // size has been placed there. A word that approaches was already
    // travelling.
    const w=Math.min(1,wordAge);
    const ease=1-Math.pow(1-w,2.2);
    const a=Math.min(1, wordAge*2.2);
    const s=cell*(1.1 + 9.5*ease);
    x.font=s+'px "IV-dot",ui-monospace,monospace';
    x.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
    x.fillText('NO', cx, cy);
  }
}
requestAnimationFrame(draw);
addEventListener('touchend',e=>{e.preventDefault(); t0=0;});
addEventListener('click',()=>{ t0=0; });
</script></body></html>
