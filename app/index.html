   it settles out of the burst into a mix, and the word comes up on the
   same screen. Cutting to black and back made them two events; this
   makes them one. */
const T={ hold:900, close:9000, burst:2600, dark:0, word:4200 };

  }
})();

function draw(t){

  x.textAlign='center'; x.textBaseline='middle';

  // --- phase 1: the two halves close on each other

  if(age>T.hold) close=Math.min(1,(age-T.hold)/T.close);
  const eased=close*close*(3-2*close);          // slow at both ends

  const inBurst = age > T.hold+T.close && age <= T.hold+T.close+T.burst;
  const bAge = inBurst ? (age-T.hold-T.close)/T.burst : 0;

    // its own clock, so the sorting dissolves rather than switching
    const scramble = afterBurst
      ? Math.min(1,(age-(T.hold+T.close+T.burst*0.4))/(T.burst*1.1)) : 0;

        const inN = u < 0.5-gap, inO = u > 0.5+gap;

          if(a<0.02) continue;

        if(a<0.025) continue;
        x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';

    // out of nothing, and keeps growing. A word that arrives at a fixed
    // size has been placed there. A word that approaches was already
    // travelling.

    const a=Math.min(1, wordAge*2.2);
    const s=cell*(1.1 + 9.5*ease);
    x.font=s+'px "IV-dot",ui-monospace,monospace';
    x.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
    x.fillText('NO', cx, cy);
  }

  buildGrain();
}

/* wood grain: long horizontal streaks, because grain runs with the plank.
   value per cell 0..1, used as density. */
function buildGrain(){
  grain=[];
  for(let y=0;y<rows;y++){
    const row=[];
    const band = Math.sin(y*0.55)*0.5 + Math.sin(y*0.17+1.3)*0.5;
    for(let x0=0;x0<cols;x0++){
      const streak = Math.sin(x0*0.04 + y*0.9)*0.25
                   + Math.sin(x0*0.011 + band*3.0)*0.35;
      const knot = Math.sin(x0*0.13+y*0.31)*0.18;
      row.push({
        v: 0.5 + streak*0.5 + knot,
        ch: Math.random()<0.5?'0':'1'
      });
    }
    grain.push(row);
  }
}
size(); addEventListener('resize',size);

/* the aperture: an irregular closed curve, wood opened from the inside.
   radius varies with angle — never a circle, never symmetrical. */
const HOLE = 0.072;                 // fraction of the short edge

/* Where the hole sits. Low, and to one side — dead centre reads as a target
   and gives the light nowhere to travel. Left is the stronger side: the
   light enters at the dark end of the gradient and has the whole frame to
   cross. Set HOLE_X to 0.72 to put it on the right instead. */
const HOLE_X = 0.28, HOLE_Y = 0.70;
function apertureR(ang){
  return HOLE * (1
       + 0.24*Math.sin(ang*2.0 + 0.6)
       + 0.17*Math.sin(ang*3.0 - 1.4)
       + 0.10*Math.sin(ang*5.0 + 2.2)
       + 0.06*Math.sin(ang*8.0 - 0.3));
}

/* ---- timing -------------------------------------------------- */
const T = { dark:1400, rise:5200, hold:4200, fall:9000 };
let t0=0;

function lightAt(age){
  if (age < T.dark) return 0;
  age -= T.dark;
  if (age < T.rise) return Math.pow(age/T.rise, 1.8);   // slow to arrive
  age -= T.rise;
  if (age < T.hold) return 1;
  age -= T.hold;
  if (age < T.fall) return Math.pow(1-age/T.fall, 1.5); // slower to leave
  return 0;
}

function draw(t){
  requestAnimationFrame(draw);
  if(!t0) t0=t;
  const L = lightAt(t-t0);

  x.clearRect(0,0,innerWidth,innerHeight);
  x.font=cell+'px ui-monospace,monospace';
  x.textBaseline='top';

  const W=innerWidth, H=innerHeight;
  const cxp=W*HOLE_X, cyp=H*HOLE_Y;
  const R0=Math.min(W,H);

  for(let y=0;y<rows;y++){
    const py=y*cell*1.15;
    for(let x0=0;x0<cols;x0++){
      const px=x0*cell;
      const dx=(px-cxp)/R0, dy=(py-cyp)/R0;
      // The radius is measured in squashed space (dy scaled), so the angle
      // must be too — otherwise the mask and the filled shape describe two
      // different ellipsoids and characters land inside the light.
      const sy=dy*0.82;
      const r=Math.hypot(dx,sy);
      const ang=Math.atan2(sy,dx);
      const edge=apertureR(ang);
      const g=grain[y][x0];

      // inside the hole there is no wood — only what is behind it
      if (r < edge*0.94) continue;

      // the rim catches the light; the far wood barely does
      const fromEdge = (r - edge)/(HOLE*0.85);        // rim scales with the hole
      const rim = Math.max(0, 1 - fromEdge*fromEdge);

      // ambient wood, always faintly there, so the dark is occupied
      let a = g.v * 0.055;
      // and the light behind the hole, spilling onto the rim only
      a += rim * L * g.v * 0.85;

      if (a < 0.012) continue;
      x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
      x.fillText(g.ch, px, py);
    }
  }

  // What is behind. Light through an opening has a HARD edge, and the
  // edge is the hole itself — not a falloff. Softness belongs only at the
  // rim, where it grazes the wood. So the aperture is filled as a shape.
  if (L > 0.002){
    x.save();
    x.beginPath();
    const N=240;
    for(let i=0;i<=N;i++){
      const ang=(i/N)*Math.PI*2;
      // same space as the mask above, inverted back into screen coords
      const rr=apertureR(ang)*0.94*R0;
      const px=cxp+Math.cos(ang)*rr;
      const py=cyp+Math.sin(ang)*rr/0.82;
      i?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.closePath();
    x.globalCompositeOperation='destination-over';
    // very slightly brighter toward the right — the law holds even here
    const gl=x.createLinearGradient(cxp-R0*HOLE,0,cxp+R0*HOLE,0);
    gl.addColorStop(0,'rgba(255,255,255,'+(0.80*L).toFixed(3)+')');
    gl.addColorStop(1,'rgba(255,255,255,'+(1.00*L).toFixed(3)+')');
    x.fillStyle=gl;
    x.fill();
    x.globalCompositeOperation='source-over';
    x.restore();
  }
}

/* ============================================================
   PAGE 50 — the collapse.

   The reader has spent 45 pages acquiring a language. Here the page
   itself stops holding it up: every character becomes a body, gravity
   arrives with the turn of the device, and what the characters strike
   on the way down takes their identity from them. What settles is 0s
   and 1s, because that is all that survives being dropped.

   The gate is the turn. It cannot be tapped through — the reader's
   posture has to change, not their finger. Nothing says so; they were
   taught this at the start of the book and never told again.

   The gate keys off the TILT SENSOR, not the viewport: a phone with
   rotation lock on never re-lays-out, and that reader must not be
   stranded.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d'), hud=document.getElementById('hud');
let W=0,H=0,cell=0;

function size(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(d,0,0,d,0,0);
  cell=Math.max(9,Math.round(Math.min(W,H)/44));
}
size(); addEventListener('resize',()=>{size();});

/* ---- gravity, from the device ------------------------------- */
let gAng=0, haveTilt=false, shownAng=0, lastT=0;
function screenAngle(){
  if (screen.orientation && typeof screen.orientation.angle==='number')
    return screen.orientation.angle*Math.PI/180;
  if (typeof window.orientation==='number') return window.orientation*Math.PI/180;
  return 0;
}
addEventListener('deviceorientation', e=>{
  if(e.gamma===null||e.beta===null) return;
  haveTilt=true;
  const b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180;
  let a=Math.atan2(Math.sin(g), -Math.sin(b)*Math.cos(g)) - screenAngle();
  while(a> Math.PI) a-=Math.PI*2;
  while(a<-Math.PI) a+=Math.PI*2;
  gAng=a;
}, true);

/* how far the device has turned from upright, 0..1 */
function turned(){ return Math.min(1, Math.abs(Math.sin(shownAng))); }

/* ---- the characters, as bodies ------------------------------ */
const VOCAB=".,:;-_!?0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const parts=[];
function build(){
  parts.length=0;
  const cols=Math.floor(W/cell)-1, rows=Math.floor(H/(cell*1.15))-1;
  for(let ry=0; ry<rows; ry++){
    for(let rx=0; rx<cols; rx++){
      // the page as the reader left it: dense to the right, per the law
      const u=rx/cols;
      if (Math.random() > 0.22+0.55*u) continue;
      parts.push({
        x:(rx+1)*cell, y:(ry+1)*cell*1.15, vx:0, vy:0,
        ch:VOCAB[(Math.random()*VOCAB.length)|0],
        id:1,                       // how much of itself it still is
        bit:Math.random()<0.5?'0':'1',
        r:cell*0.46, rest:0, woke:0
      });
    }
  }
}

/* ---- collisions ---------------------------------------------
   A spatial hash, so each body only tests against its neighbours.
   Testing every pair would be 200,000 tests a frame at this count. */
const grid=new Map();
function key(i,j){ return i+','+j; }
function hash(){
  grid.clear();
  const s=cell;
  for(const p of parts){
    const k=key(Math.floor(p.x/s), Math.floor(p.y/s));
    let a=grid.get(k); if(!a){ a=[]; grid.set(k,a); }
    a.push(p);
  }
}
function neighbours(p){
  const s=cell, i=Math.floor(p.x/s), j=Math.floor(p.y/s), out=[];
  for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
    const a=grid.get(key(i+di,j+dj)); if(a) out.push(...a);
  }
  return out;
}

let running=false, started=0, settledAt=0;

function step(dt){
  // dt is used by the loss above
  const k=turned();
  // gravity arrives WITH the turn — upright, nothing falls
  const g = 820*k;
  const gx=Math.sin(shownAng)*g, gy=Math.cos(shownAng)*g;

  for(const p of parts){
    p.vx+=gx*dt; p.vy+=gy*dt;

    // Friction rises sharply once a body is slow. Without this a pile never
    // stops — it creeps for ever on the residue of its own collisions.
    const sp=Math.hypot(p.vx,p.vy);
    // Heavy damping ONLY near rest. Applying it across a wide speed band
    // sets a terminal velocity — at 0.80 below 150 the algebra caps every
    // body at about 52 px/s, which is too slow to lose identity and too
    // fast to fall asleep. One number was suppressing both behaviours.
    const damp = sp < 45 ? 0.86 : 0.995;
    p.vx*=damp; p.vy*=damp;

    // rest detection: a body that has been slow for a while is asleep.
    // without this a deep pile churns for ever on its own contact noise.
    // A body can only fall asleep if it has been awake. Checking speed
    // alone deadlocks: everything starts at rest, so everything sleeps
    // before gravity has a chance to move it.
    if (sp > 110) p.woke = 1;
    if (p.woke && sp < 62){ p.rest++; if(p.rest>10){ p.vx=0; p.vy=0; } }
    else p.rest=0;

    // what tumbling costs
    if (sp > LOSS_MIN && p.id > 0){
      p.id -= LOSS_RATE * dt * Math.min(1.6, sp/240);
      if (p.id < 0) p.id = 0;
    }

    p.x+=p.vx*dt; p.y+=p.vy*dt;

    // the walls of the device
    const b=0.18;                       // bounce, almost none
    if(p.x<p.r){ p.x=p.r; p.vx=-p.vx*b; }
    if(p.x>W-p.r){ p.x=W-p.r; p.vx=-p.vx*b; }
    if(p.y<p.r){ p.y=p.r; p.vy=-p.vy*b; }
    if(p.y>H-p.r){ p.y=H-p.r; p.vy=-p.vy*b; }
  }

  hash();
  for(const p of parts){
    for(const q of neighbours(p)){
      if(q===p) continue;
      const dx=q.x-p.x, dy=q.y-p.y;
      const d2=dx*dx+dy*dy, rr=p.r+q.r;
      if(d2>=rr*rr || d2<1e-6) continue;
      const d=Math.sqrt(d2), n=(rr-d)/d*0.5;
      p.x-=dx*n; p.y-=dy*n; q.x+=dx*n; q.y+=dy*n;
      const rvx=q.vx-p.vx, rvy=q.vy-p.vy;
      const imp=(rvx*dx+rvy*dy)/d*0.42;
      p.vx+=dx/d*imp*0.32; p.vy+=dy/d*imp*0.32;
      q.vx-=dx/d*imp*0.32; q.vy-=dy/d*imp*0.32;
    }
  }
}

/* Collision impulses turned out to be a poor signal — too spiky, too
   dependent on how deep a body sits in the pile. Identity is spent by
   MOTION instead: a character loses itself while it is tumbling, and
   keeps whatever is left once it comes to rest.

   Same reading, far easier to pace — and the pacing is the point, because
   the reader should watch the alphabet die rather than find it dead. */
function lose(){}                                  // no longer used

const LOSS_RATE = 0.30;     // identity per second at full tumble
const LOSS_MIN  = 70;       // below this speed, nothing is lost

function draw(t){
  requestAnimationFrame(draw);
  const dt=Math.min(0.032,(t-lastT)/1000)||0.016; lastT=t;

  // ease the sensor, on a time constant so 60Hz and 120Hz agree
  const target = haveTilt ? gAng : (W>H ? Math.PI/2 : 0);
  let d=target-shownAng;
  while(d> Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  shownAng += d*(1-Math.exp(-dt*1000/95));

  if(running) step(dt);

  x.clearRect(0,0,W,H);
  x.font=cell+'px "IV-dot",ui-monospace,monospace';
  x.textAlign='center'; x.textBaseline='middle';

  let stillLanguage=0, moving=0;
  for(const p of parts){
    // identity decides which character it still is
    const isWord = p.id > 0.5;
    if(isWord) stillLanguage++;
    if(Math.hypot(p.vx,p.vy)>18) moving++;
    const ch = isWord ? p.ch : p.bit;
    const a = (0.30+0.70*(p.x/W)) * (isWord ? 0.55+0.45*p.id : 0.92);
    x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
    x.fillText(ch, p.x, p.y);
  }

  const k=turned();
  hud.textContent='p50  '+(haveTilt?'tilt':'no-tilt')
    +'  turned '+k.toFixed(2)
    +'  language '+Math.round(100*stillLanguage/Math.max(1,parts.length))+'%'
    +'  moving '+moving;
}

function start(){
  if(running) return;
  size(); build(); running=true; started=performance.now();
  const go=()=>{};
  if (typeof DeviceOrientationEvent!=='undefined' &&
      typeof DeviceOrientationEvent.requestPermission==='function')
    DeviceOrientationEvent.requestPermission().then(go).catch(go);
}
requestAnimationFrame(draw);
addEventListener('touchend',e=>{e.preventDefault(); running?0:start();});
addEventListener('click',()=>{ running?0:start(); });

/* ============================================================
   The collapsed syllable page — restructured 2026-08-20.

   30-34 used to be five separate pages, one per syllable. Now the
   section is: 30 = fever field, nonsense pair (see fever-babble-demo).
   31 = fever field, BA found — the first real babble syllable
   discovered inside that same weather. This file is what comes after
   both of those: the REMAINING syllables — MA, DA, GA, UH — shown on
   a single page, one call after another, rather than one page each.
   Per bill: "32-35 would be one page but the section will be done."

   Order: MA, DA, GA, UH — UH last on purpose (per bill, 2026-08-20).
   Originally UH opened the section as the vowel-alone coo before any
   consonant existed; now that BA has already been found on its own
   page, UH closes this page instead — the section ends on the sound
   that survives into adult speech, not the developmental placeholder.

   Same call grammar as the earlier build, fired once per syllable:
   HEAT to trigger it, then an eased approach toward the camera (NO's
   own "approaches rather than appears" technique). For MA/DA/GA the
   two letters also split apart and sweep off opposite edges as they
   grow, field sweeping outward under them — the reverse of NO's own
   field, which closes inward on the crate. UH breaks that pattern on
   purpose: it grows and lands whole, static, rather than splitting and
   leaving the frame — the section doesn't end by vanishing, it ends by
   settling. Each call hands off straight to the next syllable; once UH
   settles, the section itself is over.

   Uppercase throughout — the embedded font here only has caps, digits,
   and punctuation (it was subset for the title screen's IN/VOICE years
   ago and never needed more). Per bill: uppercase is fine for all the
   letters, so this sidesteps rebuilding that font entirely.

   Tap-and-hold to call the current syllable. Not wired into the app;
   proving ground only.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d');
const hud=document.getElementById('hud');
let W=0,H=0,cell=0,cols=0,rows=0;
let field=[];   // {i,j,ch} — sparse, quiet at rest; sweeps outward on the call

function VW(){ return (window.visualViewport?window.visualViewport.width:innerWidth); }
function VH(){ return (window.visualViewport?window.visualViewport.height:innerHeight); }
function size(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=VW(); H=VH();
  cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(dpr,0,0,dpr,0,0);
  cell=Math.max(11,Math.round(Math.min(W,H)/34));
  cols=Math.ceil(W/cell)+1; rows=Math.ceil(H/(cell*1.15))+1;
  field=[];
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    field.push({i,j, ch:'.', phase:Math.random()*Math.PI*2, period:1400+Math.random()*1800});
  }
}
addEventListener('resize', size); size();

/* ---- one page, four syllables called in sequence — UH last -------- */
const PAGE_NUM = 32;   // this whole file is a single page in the book
const SYLLS = ['MA','DA','GA','UH'];
let syllIdx=0;
let sectionDone=false;   // true once UH has resolved

/* ---- the call: HEAT to trigger it, then an eased approach toward the
   camera (NO's own grammar) once it's hot enough. Press and hold — a
   tap alone does nothing, the same way effects-demo's own HEAT needs a
   held touch, not a tap, to lift brightness. Let go too soon and it
   just cools back down; nothing was owed for trying.
   State machine: idle -> heating -> approaching -> done ------------- */
let state='idle';     // idle | heating | approaching
let heat=0;             // 0..1, effects-demo's own HEAT math: f*f*0.30*STRENGTH per frame held
let callT=0;             // time the approach started
const DUR=1100;           // ms — how long each syllable's call takes
const HEAT_STRENGTH=0.30; // same constant effects-demo's case 11 uses
const HEAT_THRESHOLD=1.0; // heat needed before it fires

function easeIn(t){ return t*t*t; }   // slow start, accelerating hard at the end

let holding=false;
function onDown(e){ if(sectionDone) return; holding=true; if(state==='idle') state='heating'; }
function onUp(e){ holding=false; }
addEventListener('touchstart', onDown, {passive:true});
addEventListener('touchend', onUp, {passive:true});
addEventListener('mousedown', onDown);
addEventListener('mouseup', onUp);

/* ---- draw ------------------------------------------------------------ */
let t0=0, tGlobal=0;
function draw(t){
  requestAnimationFrame(draw);
  if(!t0) t0=t;
  tGlobal=t; t0=t;

  x.clearRect(0,0,W,H);
  const syll = SYLLS[syllIdx];
  x.textAlign='center'; x.textBaseline='middle';

  // the field: faint and still at rest — present, not empty, so the
  // sweep on release reads as something being let go, not conjured from
  // nothing. Sweeps outward from center on the call, the reverse of
  // NO's own field closing inward on the crate at 47-48. MA/DA/GA all
  // sweep the field this way; UH stays static, so its field stays
  // quiet too, matching the letters that don't leave either.
  {
    const sweeping = state==='approaching' && syll!=='UH';
    const k = sweeping ? Math.min(1,(tGlobal-callT)/DUR) : 0;
    const e = easeIn(k);
    const maxDist = Math.hypot(W,H)*0.75;
    x.font=cell+'px "IV-dot",ui-monospace,monospace';
    for(const c of field){
      const bx=c.i*cell, by=c.j*cell*1.15;
      let px=bx, py=by, v;
      if(sweeping){
        const dx=bx-W/2, dy=by-H/2;
        const dist=Math.hypot(dx,dy)||1;
        const dirx=dx/dist, diry=dy/dist;
        const travel=e*maxDist*1.4;
        px=W/2+dirx*(dist+travel); py=H/2+diry*(dist+travel);
        v=Math.max(0,0.5*(1-k*0.4));
      } else {
        v=0.02+0.02*Math.sin(tGlobal/c.period+c.phase);
      }
      if(v<0.015) continue;
      x.fillStyle='rgba(255,255,255,'+v.toFixed(3)+')';
      x.fillText(c.ch, px, py);
    }
  }

  if(sectionDone){
    // UH has resolved — the section is over. Nothing left to call here;
    // hold a quiet, settled state rather than looping back to MA, so
    // the page reads as finished, not stuck.
    const v=0.30+0.05*Math.sin(tGlobal/3200);
    x.font='6vmin "IV-dot",ui-monospace,monospace';
    x.fillStyle='rgba(255,255,255,'+v.toFixed(3)+')';
    x.fillText(SYLLS[SYLLS.length-1], W/2, H/2);
  } else if(state==='idle'){
    // resting: small, still, waiting to be called — not a spectacle,
    // just present, the way a sound waits before it's spoken
    const v=0.5+0.08*Math.sin(tGlobal/2600);
    x.font='7vmin "IV-dot",ui-monospace,monospace';
    x.fillStyle='rgba(255,255,255,'+v.toFixed(3)+')';
    x.fillText(syll, W/2, H/2);
  } else if(state==='heating'){
    // effects-demo's own HEAT case: f*f*STRENGTH per frame while held,
    // f here is just 1 (full falloff — the whole glyph is "under the
    // finger" at once, there's no field of cells to fall off across)
    if(holding){ heat=Math.min(1.4, heat + 1*1*HEAT_STRENGTH*(1/60)*4); }
    else{ heat=Math.max(0, heat - (1/60)*1.6); }   // let go: cools, doesn't just reset

    if(heat>=HEAT_THRESHOLD){
      state='approaching'; callT=tGlobal; heat=0;
      if(navigator.vibrate) navigator.vibrate(14);
    } else if(heat<=0 && !holding){
      state='idle';
    }

    const v=0.5+heat*0.5;                 // brightens as it heats
    const grow=1+heat*0.35;               // swells slightly, real feedback
    x.font=(7*grow).toFixed(1)+'vmin "IV-dot",ui-monospace,monospace';
    const px2=(7*grow)*Math.min(W,H)/100;
    x.font=px2.toFixed(1)+'px "IV-dot",ui-monospace,monospace';
    x.fillStyle='rgba(255,255,255,'+Math.min(1,v).toFixed(3)+')';
    x.fillText(syll, W/2, H/2);
  } else if(syll==='UH'){
    // UH breaks the pattern on purpose: MA/DA/GA all sweep apart and
    // off — UH is the one that goes static instead. It grows toward
    // the camera same as the others, but stays whole and lands, rather
    // than splitting and leaving the frame — the section doesn't end
    // by vanishing, it ends by settling.
    const age=tGlobal-callT;
    const k=Math.min(1,age/DUR);
    const e=easeIn(k);
    const size=7 + e*22;           // grows to a held, on-screen size — capped, not screen-filling
    const px=size*Math.min(W,H)/100;
    x.font=px.toFixed(1)+'px "IV-dot",ui-monospace,monospace';
    x.fillStyle='rgba(255,255,255,'+(0.6+0.4*e).toFixed(3)+')';
    x.fillText(syll, W/2, H/2);

    if(k>=1){
      state='idle'; sectionDone=true;
    }
  } else {
    const age=tGlobal-callT;
    const k=Math.min(1,age/DUR);
    const e=easeIn(k);
    // grows from small toward far past screen-filling — genuinely rushes
    // the camera rather than just scaling up to a cap — AND the two
    // letters split apart and sweep off opposite edges as they grow:
    // the reverse of NO's own grammar (NO's field converges inward
    // while it grows toward the reader; here the letters diverge
    // outward while THEY grow toward the reader, same zoom, opposite
    // spread). MA/DA/GA only — UH is handled above, and goes static.
    const size=7 + e*260;                  // vmin, uncapped on purpose
    const fade=k>0.82 ? Math.max(0,1-(k-0.82)/0.18) : 1;   // only fades at the very end, once it's already overwhelmed the frame
    const px=size*Math.min(W,H)/100;
    x.font=px.toFixed(1)+'px "IV-dot",ui-monospace,monospace';
    x.fillStyle='rgba(255,255,255,'+fade.toFixed(3)+')';
    const gap = e*(W*0.95);
    x.fillText(syll[0], W/2-gap-px*0.28, H/2);
    x.fillText(syll[1], W/2+gap+px*0.28, H/2);

    if(k>=1){
      // the call is over — hand off straight to the next syllable.
      state='idle'; syllIdx++;
    }
  }

  hud.textContent = sectionDone ? 'p'+PAGE_NUM+'  section complete' :
    'p'+PAGE_NUM+'  '+syll+' ('+(syllIdx+1)+'/'+SYLLS.length+')'+
    (state==='approaching' ? '   calling…' :
     state==='heating' ? '   heat:'+heat.toFixed(2) : '   hold to call it');
}
requestAnimationFrame(draw);

/* ===== fever — locked body, verbatim. Only the mount is ours.
   This section needs live touch input (the reader holds to build/find
   things), unlike crate/no/hole/collapse which are non-interactive
   scenes — so its own listeners are relayed live while it is the page
   on screen (captured AND forwarded), not just replayed once at start. ===== */
(function(){
const _root=window.document.getElementById('seq-fever');
const _cv=_root.querySelector('canvas'), _hud=_root.querySelector('.seqhud');
const document={ getElementById:function(id){
    return id==='c'?_cv:(id==='hud'?_hud:window.document.getElementById(id)); },
  body:window.document.body,

let innerWidth=SEQ.vw(), innerHeight=SEQ.vh();
let _on=false,_pending=null; const _L={};
function addEventListener(t,f,o){
  (_L[t]=_L[t]||[]).push(f);

}
function requestAnimationFrame(cb){

/* ============================================================
   35-46 — the effects, as one shared engine.

   Every glyph on the page — clutter and the letters that matter both —
   trades dark and light on its own clock, the same technique already
   locked in the title screen's IN/VOICE inversion, just extended across
   the whole field instead of two words. That's the fever: nothing on the
   page ever sits still, no single frame is a hard flash, but the whole
   thing never settles either.

   Inside that weather, each page is a small game: a vowel and a
   consonant, drawn together by that page's gesture, answered by that
   page's release the instant they touch.

   Tap the right third to advance, left third to go back — same
   convention as effects-demo.html. Not wired into the app; this is the
   proving ground before any of it is.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d');
const hud=document.getElementById('hud');
let cols=0, rows=0, cell=0, W=0, H=0;

function VW(){ return (window.visualViewport?window.visualViewport.width:innerWidth); }
function VH(){ return (window.visualViewport?window.visualViewport.height:innerHeight); }

function size(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=VW(); H=VH();
  cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(dpr,0,0,dpr,0,0);
  cell=Math.max(11,Math.round(Math.min(W,H)/34));
  cols=Math.ceil(W/cell)+1;
  rows=Math.ceil(H/(cell*1.15))+1;
  buildField();
}
addEventListener('resize', size);

/* ---- the twelve pages -----------------------------------------
   pairs: each carries its own {letters,gesture} — the five double-
   letter pages get TWO distinct gestures now, one per pair, instead
   of one gesture stamped across both. That's also where the three
   built-but-unused effects (flip tile, ink bleed, peel) finally land
   — all fifteen of effects-demo's modes are now actually assigned
   somewhere, not just the twelve from the first draft. Single-pair
   pages keep one gesture; release stays one per page either way.

   tint: the field's own color, page to page — not just the letters
   and gestures now, the WEATHER itself changes. Cool and slow at 35,
   built up toward the hot, fast, red-shifted field at 46, tracking
   the same quiet-to-loud climb the releases and transitions already
   make. pace: a period multiplier on the field's flicker/drift clocks
   — under 1 runs faster (more restless) than the field's baseline. */
const PAGES = [
 {p:35, pairs:[{letters:['C','E'],gesture:'move'}, {letters:['F','I'],gesture:'flip'}],
        release:'click',      tint:[255,255,255], pace:1.15},
 {p:36, pairs:[{letters:['H','E'],gesture:'pull'}],
        release:'collapse',   tint:[205,222,255], pace:1.05},
 {p:37, pairs:[{letters:['J','I'],gesture:'trail'}, {letters:['K','E'],gesture:'bleed'}],
        release:'glow',       tint:[255,238,215], pace:1.00},
 {p:38, pairs:[{letters:['L','I'],gesture:'nap'}],
        release:'bloom',      tint:[215,255,225], pace:0.95},
 {p:39, pairs:[{letters:['N','I'],gesture:'ripple'}, {letters:['P','U'],gesture:'peel'}],
        release:'shock',      tint:[195,250,255], pace:0.88},
 {p:40, pairs:[{letters:['Q','E'],gesture:'press'}],
        release:'heavyglow',  tint:[255,220,165], pace:0.82},
 {p:41, pairs:[{letters:['R','I'],gesture:'displace'}, {letters:['S','I'],gesture:'press'}],
        release:'crack',      tint:[255,205,195], pace:0.76},
 {p:42, pairs:[{letters:['T','I'],gesture:'repel'}],
        release:'hardcrack',  tint:[255,175,160], pace:0.68},
 {p:43, pairs:[{letters:['V','U'],gesture:'mirror'}],
        release:'double',     tint:[225,190,255], pace:0.62},
 {p:44, pairs:[{letters:['W','E'],gesture:'erode'}, {letters:['X','U'],gesture:'pull'}],
        release:'crumble',    tint:[205,200,195], pace:0.56},
 {p:45, pairs:[{letters:['Y','U'],gesture:'heat'}],
        release:'overexpose', tint:[255,205,150], pace:0.48},
 {p:46, pairs:[{letters:['Z','U'],gesture:'destab'}],
        release:'strobe',     tint:[255,170,150], pace:0.40},
];
let pageIdx=0;

/* ---- the field — take two. The first version was every cell on its
   own idle clock, tinted per page: that made twelve pages FEEL
   different but never actually look structurally different — one
   background with variations. This ports effects-demo.html's real
   per-mode field engine wholesale instead: F/base/nap/vel/ch are the
   same cellular arrays, apply()/relax() are the same per-mode physics
   (displacement, magnetic pull/repel, ripple, carpet nap, press,
   trail, destabilise, flip tile, ink bleed, heat, mirror, erosion,
   peel), driven by touch position ANYWHERE on screen, not just near
   the two target letters. Each page gets ONE mode — its own gesture's
   mode number — so the whole background actually displaces, bleeds,
   erodes, doubles, the way effects-demo's own field did, not just an
   idle shimmer with a different tint. STRENGTH climbs page to page —
   "each page grows to the end" — the same escalation pace/tint used
   to carry, now doing real structural work instead of cosmetic. */
const RAMP=" .,-~:_;!I|/1TL7JY?FVCZS3AXK2UP0O548EG9H6RDQBNWM";
const GESTURE_TO_MODE = {
  move:0, displace:1, pull:2, repel:3, ripple:4, nap:5, press:6, trail:7,
  destab:8, flip:9, bleed:10, heat:11, mirror:12, erode:13, peel:14
};
let F=null, base=null, nap=null, vel=null, fch=null;   // the cellular field itself
let fieldMode=0, fieldStrength=1.6;
let fx=-1, fy=-1, fpx=-1, fpy=-1, fdown=false;         // raw touch, independent of letter-dragging
let one={i:-1,j:-1,dx:0,dy:0};                          // mode 0's single movable letter (field-local)

function buildFieldArrays(){
  const n=cols*rows;
  F=new Float32Array(n); base=new Float32Array(n);
  nap=new Float32Array(n); vel=new Float32Array(n*2);
  fch=new Uint8Array(n);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols, u=i/cols, v=j/rows;
    const b=0.18+0.55*u + 0.16*Math.sin(v*7+u*3) + 0.10*Math.sin(u*19-v*5);
    base[k]=Math.max(0,Math.min(1,b));
    F[k]=base[k];
    fch[k]=(Math.abs(Math.sin(i*12.9898+j*78.233)*43758.5453)%1)*RAMP.length|0;
  }
}
function resetFieldArrays(){
  if(!F) return;
  F.set(base); nap.fill(0); vel.fill(0);
  one={i:-1,j:-1,dx:0,dy:0};
}
const FIELD_RADIUS=7.5;
function applyField(dt){
  if(fx<0) return;
  const ci=fx/cell, cj=fy/(cell*1.15);
  const cpi=fpx/cell, cpj=fpy/(cell*1.15);
  const dxm=ci-cpi, dym=cj-cpj;
  const R=FIELD_RADIUS, R2=R*R;
  const i0=Math.max(0,(ci-R)|0), i1=Math.min(cols-1,(ci+R)|0);
  const j0=Math.max(0,(cj-R)|0), j1=Math.min(rows-1,(cj+R)|0);
  const S=fieldStrength;
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const k=i+j*cols;
    const dx=i-ci, dy=j-cj, d2=dx*dx+dy*dy;
    if(d2>R2) continue;
    const f=1-Math.sqrt(d2)/R;
    switch(fieldMode){
      case 1: vel[k*2]+=dx*f*1.6*S; vel[k*2+1]+=dy*f*1.6*S; break;
      case 2: vel[k*2]-=dx*f*1.2*S; vel[k*2+1]-=dy*f*1.2*S; break;
      case 3: vel[k*2]+=dx*f*2.2*S; vel[k*2+1]+=dy*f*2.2*S; break;
      case 4: if(fdown) F[k]+=Math.sin(Math.sqrt(d2)*2.2-tGlobal*0.012)*f*0.5*S; break;
      case 5: nap[k]+=(dxm*0.9*S-nap[k])*f*0.5; break;
      case 6: F[k]-=f*0.16*S; break;
      case 7: F[k]+=f*0.35*S; break;
      case 8: if(Math.random()<f*0.5*S) fch[k]=(Math.random()*RAMP.length)|0; break;
      case 9: if(Math.random()<f*0.35*S) fch[k]=(fch[k]+1)%RAMP.length; break;
      case 10: F[k]-=f*f*0.30*S; break;
      case 11: F[k]+=f*f*0.30*S; break;
      case 12: { const mi=cols-1-i, mk=mi+j*cols; F[k]+=f*0.30*S; F[mk]+=f*0.30*S; break; }
      case 13: F[k]-=f*0.5*S; break;
      case 14: F[k]+=f*0.6*S; nap[k]+=f*0.4*S; break;
    }
  }
  if(fieldMode===0 && fdown){
    if(one.i<0){ one.i=Math.round(ci); one.j=Math.round(cj); }
    one.dx=ci-one.i; one.dy=cj-one.j;
  }
  if(fieldMode===0 && !fdown){ one.dx*=0.86; one.dy*=0.86; }
}
function relaxField(dt){
  for(let k=0;k<F.length;k++){
    const rate=(fieldMode===5||fieldMode===14) ? 0.004 : 0.035;
    F[k]+=(base[k]-F[k])*rate;
    if(fieldMode>=1&&fieldMode<=3){
      vel[k*2]*=0.90; vel[k*2+1]*=0.90;
      vel[k*2]+=(0-vel[k*2])*0.06; vel[k*2+1]+=(0-vel[k*2+1])*0.06;
    }
    if(fieldMode===7) F[k]+=(base[k]-F[k])*0.06;
  }
}

let pairs=[];      // active pairs for this page: {a:{ch,x,y,vx,vy}, b:{...}, met, releaseT}
let held=null;     // which letter is being dragged
let t0=0, tGlobal=0;
let metAt=0;       // when every pair on this page first became "met" — drives auto-advance

/* ---- page-to-page transitions — one named effect per page, doubling
   as both that page's outro and the next page's intro. Not a plain cut:
   an assortment (flash, wipe, fade, bloom, ripple, shatter, dissolve,
   strobe...), roughly escalating with the release grammar each page
   already carries, so the turn itself keeps building toward NO the same
   way the releases do. swapAt is where in the transition the actual
   page-load happens — early for hard cuts, mid-curve for soft fades. */
// a plain fade to black, holding on black for a beat before the next
// page fades in — same treatment on every page 35-46, on both manual
// edge-taps and the auto-advance once a page's pairs are all found
const TRANSITIONS = [
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 35
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 36
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 37
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 38
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 39
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 40
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 41
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 42
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 43
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 44
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 45
 {kind:'fadeBlack', dur:2600, swapAt:0.5},  // 46
];
let trans=null;   // {kind,dur,swapAt,t0,toIdx,swapped}

function startTransition(dir){
  if(trans) return;
  const fromIdx=pageIdx;
  const toIdx=(pageIdx+dir+PAGES.length)%PAGES.length;
  const cfgT=TRANSITIONS[fromIdx];
  trans={kind:cfgT.kind, dur:cfgT.dur, swapAt:cfgT.swapAt, t0:tGlobal, toIdx, swapped:false};
}

function drawTransition(kind, k){
  switch(kind){
    case 'fadeBlack': {
      // fade out (~19%), hold on black (~58%, ~1.5s of the 2.6s total —
      // "at least a second or two" before the next page fades in), fade in
      const outEnd=0.19, holdEnd=0.77;
      let a;
      if(k<outEnd) a=k/outEnd;
      else if(k<holdEnd) a=1;
      else a=1-(k-holdEnd)/(1-holdEnd);
      x.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')';
      x.fillRect(0,0,W,H);
      break;
    }
    case 'flash': {
      const v = k<0.5 ? k/0.5 : 1-(k-0.5)/0.5;
      x.fillStyle='rgba(255,255,255,'+(v*0.9).toFixed(3)+')';
      x.fillRect(0,0,W,H);
      break;
    }
    case 'irisWipe': {
      // a black bar sweeps left to right, fully covering mid-transition
      const bx = -W + k*(W*2);
      x.fillStyle='#000';
      x.fillRect(bx-W*0.15, 0, W*1.3, H);
      break;
    }
    case 'fade': {
      const v = k<0.5 ? k/0.5 : 1-(k-0.5)/0.5;
      x.fillStyle='rgba(0,0,0,'+v.toFixed(3)+')';
      x.fillRect(0,0,W,H);
      break;
    }
    case 'bloom': {
      const v = k<0.55 ? k/0.55 : 1-(k-0.55)/0.45;
      const r = Math.hypot(W,H)*0.6*Math.min(1,k/0.55);
      x.fillStyle='rgba(255,255,255,'+(v*0.85).toFixed(3)+')';
      x.beginPath(); x.arc(W/2,H/2,r,0,7); x.fill();
      break;
    }
    case 'ripple': {
      const v = k<0.5?k/0.5:1-(k-0.5)/0.5;
      x.strokeStyle='rgba(255,255,255,'+(v*0.8).toFixed(3)+')';
      x.lineWidth=6;
      const r = k*Math.hypot(W,H)*0.9;
      x.beginPath(); x.arc(W/2,H/2,r,0,7); x.stroke();
      x.fillStyle='rgba(255,255,255,'+(v*0.4).toFixed(3)+')';
      x.fillRect(0,0,W,H);
      break;
    }
    case 'heavyfade': {
      const v = k<0.5?k/0.5:1-(k-0.5)/0.5;
      x.fillStyle='rgba(255,220,180,'+(v*0.7).toFixed(3)+')';
      x.fillRect(0,0,W,H);
      break;
    }
    case 'crack': {
      const v = k<0.5?k/0.5:1-(k-0.5)/0.5;
      x.strokeStyle='rgba(255,255,255,'+v.toFixed(3)+')';
      x.lineWidth=2;
      for(let i=0;i<8;i++){
        const ang=i/8*Math.PI*2;
        const len=Math.hypot(W,H)*0.7*k;
        x.beginPath(); x.moveTo(W/2,H/2);
        x.lineTo(W/2+Math.cos(ang)*len, H/2+Math.sin(ang)*len);
        x.stroke();
      }
      x.fillStyle='rgba(255,255,255,'+(v*0.5).toFixed(3)+')';
      x.fillRect(0,0,W,H);
      break;
    }
    case 'hardcrack': {
      const v = k<0.45?k/0.45:1-(k-0.45)/0.55;
      x.strokeStyle='rgba(255,255,255,'+v.toFixed(3)+')';
      x.lineWidth=3;
      for(let i=0;i<12;i++){
        const ang=i/12*Math.PI*2+0.3;
        const len=Math.hypot(W,H)*0.8*Math.min(1,k*1.6);
        x.beginPath(); x.moveTo(W/2,H/2);
        x.lineTo(W/2+Math.cos(ang)*len, H/2+Math.sin(ang)*len);
        x.stroke();
      }
      x.fillStyle='rgba(255,255,255,'+(v*0.7).toFixed(3)+')';
      x.fillRect(0,0,W,H);
      break;
    }
    case 'doubleflash': {
      const on = (k<0.16)||(k>0.30&&k<0.46)||(k>0.7&&k<0.86);
      if(on){ x.fillStyle='#fff'; x.fillRect(0,0,W,H); }
      break;
    }
    case 'crumble': {
      const v = k<0.6?k/0.6:1-(k-0.6)/0.4;
      const n=Math.floor(v*300);
      x.fillStyle='rgba(180,180,180,'+(v*0.9).toFixed(3)+')';
      for(let i=0;i<n;i++){
        const seed=i*13.37;
        const px=(Math.sin(seed)*0.5+0.5)*W;
        const py=(Math.cos(seed*1.7)*0.5+0.5)*H;
        x.fillRect(px,py,2,2);
      }
      break;
    }
    case 'overexpose': {
      const v = k<0.35?Math.min(1,k/0.35):Math.max(0,1-(k-0.35)/0.65);
      x.fillStyle='rgba(255,255,255,'+v.toFixed(3)+')';
      x.fillRect(0,0,W,H);
      break;
    }
    case 'strobecut': {
      const flick=(Math.floor(k*22)%2===0) && k<0.85;
      if(flick){ x.fillStyle='#fff'; x.fillRect(0,0,W,H); }
      if(k>=0.85 && k<0.94){ x.fillStyle='#000'; x.fillRect(0,0,W,H); }
      break;
    }
  }
}

function buildField(){
  buildFieldArrays();
  loadPage(pageIdx);
}

/* ---- pages 36-46: eleven structurally distinct backgrounds -------
   The fever field engine (displacement/pull/mirror/etc as ONE shared
   cellular system) stays on page 35 only, per direction: "the fever
   dream aspect is the whole section, not just the one background."
   Each of these writes straight into F[] every frame with its OWN
   generating logic — rings, scanlines, stripes, dust, pulse, cracks,
   rain, mirror-quadrant, sand-drift, heat-shimmer, chaos-strobe — so
   the render loop below (unchanged) just draws whatever's in F[]. */
function clamp01(v){ return v<0?0:v>1?1:v; }
function touchCell(){ return {ci:fx/cell, cj:fy/(cell*1.15)}; }

function bg36_rings(dt){
  const {ci,cj}=touchCell();
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    const dx=i-cols*0.5, dy=j-rows*0.5, d=Math.hypot(dx,dy);
    let v=0.20+0.20*Math.sin(d*0.55 - tGlobal*0.0035);
    if(fdown){
      const dd=Math.hypot(i-ci,j-cj);
      v+=Math.max(0,0.7-dd*0.045)*Math.max(0,Math.sin(dd*0.5-tGlobal*0.02));
    }
    F[k]=clamp01(v);
  }
}
function bg37_scan(dt){
  const {ci,cj}=touchCell();
  const band=(tGlobal*0.02)%rows;
  for(let j=0;j<rows;j++){
    const rowV=0.14+0.5*Math.max(0,1-Math.abs((j-band+rows)%rows)*0.4);
    for(let i=0;i<cols;i++){
      const k=i+j*cols;
      let v=rowV*(0.6+0.4*Math.sin(i*0.4+tGlobal*0.003));
      if(fdown && Math.abs(j-cj)<3) v+=0.4*Math.max(0,1-Math.abs(i-ci)/14);
      F[k]=clamp01(v);
    }
  }
}
function bg38_stripes(dt){
  const {ci,cj}=touchCell();
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    let bend=0;
    if(fdown){
      const dd=Math.hypot(i-ci,j-cj);
      bend=Math.max(0,1-dd/12)*Math.sin(dd*0.4)*6;
    }
    const s=(i+j*0.6+bend-tGlobal*0.01)%6;
    const v=(s>0&&s<3)?0.5:0.10;
    F[k]=clamp01(v+0.08*Math.sin(j*0.3+tGlobal*0.002));
  }
}
function bg39_dust(dt){
  const {ci,cj}=touchCell();
  const flick=Math.floor(tGlobal*0.002);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    const n=Math.abs(Math.sin(i*12.9898+j*78.233+flick*3.7)*43758.5453)%1;
    let v=n<0.08?0.55:0.08;
    if(fdown){
      const dd=Math.hypot(i-ci,j-cj);
      if(dd<10 && n<0.35) v=0.5;
    }
    F[k]=clamp01(v);
  }
}
function bg40_pulse(dt){
  const {ci,cj}=touchCell();
  const pulse=0.5+0.5*Math.sin(tGlobal*0.0022);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    const d=Math.hypot(i-cols*0.5,j-rows*0.5)/Math.max(cols,rows);
    let v=Math.max(0,0.5-d)*pulse*1.2+0.05;
    if(fdown){
      const dd=Math.hypot(i-ci,j-cj)/Math.max(cols,rows);
      v+=Math.max(0,0.5-dd)*0.6;
    }
    F[k]=clamp01(v);
  }
}
let cracks41=[];
function distToSeg(px,py,x1,y1,x2,y2){
  const A=px-x1,B=py-y1,C=x2-x1,D=y2-y1;
  const len2=C*C+D*D||1;
  const t=Math.max(0,Math.min(1,(A*C+B*D)/len2));
  return Math.hypot(px-(x1+t*C), py-(y1+t*D));
}
function bg41_crack(dt){
  const {ci,cj}=touchCell();
  if(fdown && Math.random()<0.3 && cracks41.length<40){
    cracks41.push({x:ci,y:cj,ang:Math.random()*Math.PI*2,len:0});
  }
  for(const c of cracks41) c.len=Math.min(30,c.len+dt*0.02);
  while(cracks41.length>40) cracks41.shift();
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    let v=0.07;
    for(const c of cracks41){
      const ex=c.x+Math.cos(c.ang)*c.len, ey=c.y+Math.sin(c.ang)*c.len;
      const dd=distToSeg(i,j,c.x,c.y,ex,ey);
      if(dd<1.2) v=Math.max(v,0.7-dd*0.4);
    }
    F[k]=clamp01(v);
  }
}
let rainCols=null;
function bg42_rain(dt){
  if(!rainCols){ rainCols=new Float32Array(cols); for(let i=0;i<cols;i++) rainCols[i]=Math.random()*rows; }
  const {ci}=touchCell();
  for(let i=0;i<cols;i++){
    rainCols[i]+=dt*0.006*(1+(fdown && Math.abs(i-ci)<6 ? 1.5:0));
    if(rainCols[i]>rows+8) rainCols[i]=-Math.random()*10;
  }
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    const dist=rainCols[i]-j;
    F[k]=clamp01((dist>0&&dist<8) ? Math.max(0,0.6-dist*0.08) : 0.05);
  }
}
function bg43_mirror(dt){
  const {ci,cj}=touchCell();
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    F[k]=clamp01(0.10+0.10*Math.sin(i*0.5+j*0.3+tGlobal*0.002));
  }
  if(fdown){
    const R=8;
    const i0=Math.max(0,(ci-R)|0), i1=Math.min(cols-1,(ci+R)|0);
    const j0=Math.max(0,(cj-R)|0), j1=Math.min(rows-1,(cj+R)|0);
    for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
      const dd=Math.hypot(i-ci,j-cj);
      if(dd>R) continue;
      const f=1-dd/R;
      const k=i+j*cols, mi=cols-1-i, mk=mi+j*cols;
      F[k]=clamp01(F[k]+f*0.5); F[mk]=clamp01(F[mk]+f*0.5);
    }
  }
}
function bg44_sand(dt){
  const {ci,cj}=touchCell();
  const flow=tGlobal*0.003;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    let v=0.10+0.18*Math.sin((i+j*1.3)*0.35-flow*3+Math.sin(j*0.2)*2);
    if(fdown){
      const dd=Math.hypot(i-ci,j-cj);
      if(dd<12) v+=Math.max(0,0.5-dd*0.045)*Math.sin((j-cj)*0.6-tGlobal*0.01);
    }
    F[k]=clamp01(v);
  }
}
function bg45_heat(dt){
  const {ci,cj}=touchCell();
  for(let j=0;j<rows;j++){
    const shift=Math.sin(j*0.25+tGlobal*0.004)*3;
    for(let i=0;i<cols;i++){
      const k=i+j*cols;
      let v=0.13+0.25*Math.sin((i+shift)*0.3+tGlobal*0.006);
      if(fdown){
        const dd=Math.hypot(i-ci,j-cj);
        if(dd<10) v+=Math.max(0,0.6-dd*0.06);
      }
      F[k]=clamp01(v);
    }
  }
}
function bg46_chaos(dt){
  const {ci,cj}=touchCell();
  const churn=Math.floor(tGlobal*0.02);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const k=i+j*cols;
    const n=Math.abs(Math.sin(i*12.9898+j*78.233+churn*3.7)*43758.5453)%1;
    let v=0.14+0.35*n;
    if(fdown){
      const dd=Math.hypot(i-ci,j-cj);
      if(dd<16 && Math.random()<0.4) v=Math.random();
    }
    F[k]=clamp01(v);
  }
}
const BG_FUNCS=[bg36_rings,bg37_scan,bg38_stripes,bg39_dust,bg40_pulse,
                bg41_crack,bg42_rain,bg43_mirror,bg44_sand,bg45_heat,bg46_chaos];
function computeFieldFrame(dt){
  if(pageIdx===0){ applyField(dt); relaxField(dt); return; }
  const fn=BG_FUNCS[pageIdx-1];
  if(fn) fn(dt);
}

function loadPage(i){
  const cfg=PAGES[i];
  pairs = cfg.pairs.map(pd=>{
    const [cons,vow]=pd.letters;
    // scatter the two letters apart, roughly on opposite thirds of the frame
    const ang = Math.random()*Math.PI*2;
    const r = Math.min(W,H)*0.28;
    const cx=W/2+Math.cos(ang)*r, cy=H/2+Math.sin(ang)*r;
    const vx=W/2-Math.cos(ang)*r, vy=H/2-Math.sin(ang)*r;
    return {
      a:{ch:cons, x:cx, y:cy, vx:0, vy:0, px:cx, py:cy, isVowel:false},
      b:{ch:vow,  x:vx, y:vy, vx:0, vy:0, px:vx, py:vy, isVowel:true},
      met:false, releaseT:0,
      erode:0, heat:0, napx:0, napy:0, bleed:0,
      gesture: pd.gesture
    };
  });
  held=null;
  metAt=0;   // reset the "all pairs found" clock for the new page
  // the whole-field mode is THIS page's own gesture — one mode, the
  // entire background, not an ambient idle shared by all twelve pages.
  // Strength climbs page to page: quiet at 35, MAXIMUM by 46.
  // the shared fever field engine now belongs to page 35 alone — the
  // rest each run their own distinct background (see BG_FUNCS above)
  if(i===0){
    fieldMode = GESTURE_TO_MODE[cfg.pairs[0].gesture] ?? 0;
    fieldStrength = 3.2;
  } else {
    fieldMode = -1;
  }
  resetFieldArrays();
}

/* ---- input: drag whichever letter is nearest the touch ----------- */
let dragging=null; // {pair, which}
function nearestLetter(px,py){
  let best=null, bd=Infinity;
  for(const pr of pairs){
    if(pr.met) continue;
    for(const key of ['a','b']){
      const L=pr[key];
      const d=Math.hypot(L.x-px, L.y-py);
      if(d<bd){ bd=d; best={pair:pr, which:key}; }
    }
  }
  return bd<cell*3.2 ? best : null;
}
function onDown(e){
  if(trans) return;   // a transition is already running — ignore taps
  const t=e.changedTouches?e.changedTouches[0]:e;
  const nx=t.clientX, ny=t.clientY;
  // forward page-turn requires the page's letters to actually have been
  // found first — an edge tap on a still-unsolved page is just a tap,
  // not a skip. Back-tap stays free since that page is already solved.
  if(nx>W*0.66){ if(pairs.every(pr=>pr.met)) startTransition(1); return; }
  if(nx<W*0.34){ startTransition(-1); return; }
  dragging=nearestLetter(nx,ny);
  // the field reacts to touch ANYWHERE in the middle third, not just
  // near the two target letters — that's what makes the whole
  // background actually move, not only the letters sitting on it
  fdown=true; fx=fpx=nx; fy=fpy=ny;
}
function onMove(e){
  const t=e.changedTouches?e.changedTouches[0]:e;
  const nx=t.clientX, ny=t.clientY;
  if(fdown){ fpx=fx; fpy=fy; fx=nx; fy=ny; }
  if(!dragging) return;
  const L=dragging.pair[dragging.which];
  L.tx=nx; L.ty=ny; L.dragged=true;
}
function onUp(){ dragging=null; fdown=false; }
addEventListener('touchstart', onDown, {passive:true});
addEventListener('touchmove', onMove, {passive:true});
addEventListener('touchend', onUp, {passive:true});
addEventListener('mousedown', onDown);
addEventListener('mousemove', e=>{ if(dragging) onMove(e); });
addEventListener('mouseup', onUp);

/* ---- gesture physics: real per-effect physics, ported from
   effects-demo.html's own formulas rather than approximated — each of
   the twelve gestures now actually does what its name promises instead
   of falling back to plain dragging. vx/vy are real velocity, damped
   each frame below; STRENGTH constants match effects-demo's own. ------ */
function applyGesture(pr, dt, gesture, cfgIdx){
  for(const key of ['a','b']){
    const L=pr[key];
    const o=pr[key==='a'?'b':'a'];
    const dragged = L.dragged && dragging && dragging.pair===pr && dragging.which===key;
    // "held" is true from the instant of touchdown, even before any
    // movement — heat/press need this (a still hold should still heat
    // up), unlike nap/ripple/displace/erode which genuinely need L.tx
    // to exist from an actual move
    const held = dragging && dragging.pair===pr && dragging.which===key;

    if(dragged){
      // eased toward the finger — feel varies by gesture
      const k = gesture==='press' ? 0.010 : gesture==='repel' ? 0.020 : 0.045;
      L.x += (L.tx-L.x)*Math.min(1,k*dt);
      L.y += (L.ty-L.y)*Math.min(1,k*dt);
    }

    if(gesture==='pull'){
      // effects-demo case 2, magnetic pull, strength-matched: the OTHER
      // letter is drawn toward wherever the dragged one currently is
      if(!dragged){
        const d=Math.hypot(o.x-L.x,o.y-L.y)||1;
        L.vx += (o.x-L.x)/d*1.2*0.02*dt;
        L.vy += (o.y-L.y)/d*1.2*0.02*dt;
      }
    } else if(gesture==='repel'){
      // effects-demo case 3, magnetic repel, stronger than pull
      const d=Math.hypot(o.x-L.x,o.y-L.y)||1;
      if(d<cell*8){
        L.vx -= (o.x-L.x)/d*2.2*0.02*dt;
        L.vy -= (o.y-L.y)/d*2.2*0.02*dt;
      }
    } else if(gesture==='destab'){
      L.x += Math.sin(tGlobal*0.004+L.x*0.01)*0.4;
      L.y += Math.cos(tGlobal*0.0037+L.y*0.01)*0.4;
    } else if(gesture==='nap' && dragged){
      // effects-demo case 5, carpet nap: direction of the drag is
      // remembered and the letter is carried ALONG that memory rather
      // than snapping straight to the finger — brush a path, don't drag
      const dxm=(L.tx-L.px)||0, dym=(L.ty-L.py)||0;
      pr.napx += (dxm*0.9-pr.napx)*0.15; pr.napy += (dym*0.9-pr.napy)*0.15;
      L.x += pr.napx*0.4; L.y += pr.napy*0.4;
    } else if(gesture==='ripple' && dragged){
      // effects-demo case 4, ripple: a wave leaves the finger and
      // nudges the OTHER letter if it's within range — the pair has to
      // be actively re-corrected, not just carried
      const d=Math.hypot(o.x-L.x,o.y-L.y)||1;
      if(d<cell*10){
        const wave=Math.sin(d*0.08-tGlobal*0.012)*0.5;
        o.vx += (o.x-L.x)/d*wave*0.35; o.vy += (o.y-L.y)/d*wave*0.35;
      }
    } else if(gesture==='press' && held){
      // effects-demo case 6, press/weight: real gravity while held —
      // it settles toward whatever's below, not just tracked slowly.
      // Held, not dragged: weight applies from the instant of touch,
      // it doesn't need to have already moved.
      L.vy += 0.012*dt;
    } else if(gesture==='displace' && dragged){
      // effects-demo case 1, displacement: approaching the other letter
      // physically pushes it aside, springs back via the damping below
      const d=Math.hypot(o.x-L.x,o.y-L.y)||1;
      if(d<cell*6){
        const f=1-d/(cell*6);
        o.vx += (o.x-L.x)/d*f*1.6*0.05; o.vy += (o.y-L.y)/d*f*1.6*0.05;
      }
    } else if(gesture==='erode' && dragged){
      // effects-demo case 13, erosion: repeated dragging wears down the
      // distance required for contact — the barrier between them thins
      const speed=Math.hypot(L.x-L.px,L.y-L.py);
      pr.erode=Math.min(1, pr.erode + speed*0.0015);
    } else if(gesture==='heat'){
      // effects-demo case 11, heat: holding lifts and keeps lifting —
      // here that heat softens the two letters toward each other. Held,
      // not dragged: a still finger should still build heat — that's
      // the whole point of press-and-hold, not press-and-drag.
      if(held) pr.heat=Math.min(1, pr.heat + 1*1*0.30*(dt/1000)*4);
      else pr.heat=Math.max(0, pr.heat - (dt/1000)*0.15);
      if(pr.heat>0){
        const d=Math.hypot(o.x-L.x,o.y-L.y)||1;
        L.vx += (o.x-L.x)/d*pr.heat*0.05; L.vy += (o.y-L.y)/d*pr.heat*0.05;
      }
    } else if(gesture==='flip'){
      // effects-demo case 9, flip tile: "steps through the set like a
      // split-flap" — the letter itself hasn't decided what it is yet
      // while it's moving, flickering through the field's own RAMP
      // glyphs, faster the harder it's dragged, always resolving back
      // to its true letter the instant it's released or held still
      if(dragged){
        const speed=Math.hypot(L.x-L.px,L.y-L.py);
        L.flipping = Math.random() < Math.min(0.9,0.15+speed*0.03);
      } else { L.flipping=false; }
    } else if(gesture==='bleed'){
      // effects-demo case 10, ink bleed: darkness spreads outward and
      // KEEPS spreading while held, unlike heat's brightness — this
      // pools rather than glows, and drains slowly once let go rather
      // than snapping back
      if(held) pr.bleed=Math.min(1, pr.bleed + (dt/1000)*0.5);
      else pr.bleed=Math.max(0, pr.bleed - (dt/1000)*0.12);
    } else if(gesture==='peel' && dragged){
      // effects-demo case 14, peel: "lifts an edge, revealing what is
      // under" — reuses the trail's lit-path idea but decays at case
      // 14's own much slower rate (0.004 vs trail's 0.06 in
      // effects-demo), so the peeled-back path stays lit far longer
      pr.trail = pr.trail||[];
      pr.trail.push({x:L.x, y:L.y, a:1});
      if(pr.trail.length>90) pr.trail.shift();
      for(const s of pr.trail) s.a*=0.985;
    }
    L.px=L.x; L.py=L.y;   // remember for next frame's nap/erode deltas
  }

  // velocity integration + damping — real motion for the impulse-based
  // gestures above (pull/repel/ripple/displace/heat/press), inert
  // (0,0) and free for everything else
  for(const key of ['a','b']){
    const L=pr[key];
    L.x += L.vx*dt; L.y += L.vy*dt;
    L.vx *= 0.90; L.vy *= 0.90;
  }

  if(gesture==='trail'){
    pr.trail = pr.trail||[];
    pr.trail.push({x:pr.a.dragged?pr.a.x:pr.b.x, y:pr.a.dragged?pr.a.y:pr.b.y, a:1});
    if(pr.trail.length>40) pr.trail.shift();
    for(const s of pr.trail) s.a*=0.94;
  }
}

/* ---- contact + release -------------------------------------------
   Reserve the actual outward burst for NO alone. These twelve pages get
   its quieter relatives instead, escalating roughly quiet -> loud, so
   NO still reads as new when it finally arrives. */
function checkContact(pr, gesture){
  if(pr.met) return;
  // erosion widens the contact radius as the barrier wears down —
  // meeting gets easier the more you've worked at it, not a fixed target
  const radius = gesture==='erode' ? cell*(1.3+pr.erode*2.4) : cell*1.3;
  const d=Math.hypot(pr.a.x-pr.b.x, pr.a.y-pr.b.y);
  if(d < radius){
    pr.met=true; pr.releaseT=tGlobal;
    if(navigator.vibrate) navigator.vibrate(pr.releaseHaptic||20);
  }
}

function drawRelease(pr, release, age){
  const mx=(pr.a.x+pr.b.x)/2, my=(pr.a.y+pr.b.y)/2;
  switch(release){
    case 'click': /* nothing visual at all — the haptic alone is the answer */ break;
    case 'collapse': {
      const k=Math.max(0,1-age/500);
      x.fillStyle='rgba(255,255,255,'+(0.5*k).toFixed(3)+')';
      x.beginPath(); x.arc(mx,my,cell*1.4*k,0,7); x.fill();
      break;
    }
    case 'glow': case 'heavyglow': {
      const dur = release==='heavyglow'?1100:700;
      const k=Math.max(0,1-age/dur);
      x.fillStyle='rgba(255,220,180,'+(0.55*k).toFixed(3)+')';
      x.beginPath(); x.arc(mx,my,cell*(1.6+1.2*(1-k)),0,7); x.fill();
      break;
    }
    case 'bloom': {
      const k=Math.max(0,1-age/900);
      x.fillStyle='rgba(255,255,255,'+(0.35*k).toFixed(3)+')';
      x.beginPath(); x.arc(mx,my,cell*(1+2.2*(1-k)),0,7); x.fill();
      break;
    }
    case 'shock': {
      const k=Math.max(0,1-age/650);
      x.strokeStyle='rgba(255,255,255,'+(0.6*k).toFixed(3)+')';
      x.lineWidth=2;
      x.beginPath(); x.arc(mx,my,cell*8*(1-k)+cell*2,0,7); x.stroke();
      break;
    }
    case 'crack': case 'hardcrack': {
      const n = release==='hardcrack'?9:6;
      const k=Math.max(0,1-age/500);
      x.strokeStyle='rgba(255,255,255,'+(0.75*k).toFixed(3)+')';
      x.lineWidth=1.5;
      for(let i=0;i<n;i++){
        const ang=i/n*Math.PI*2 + (release==='hardcrack'?0.3:0);
        const len=cell*(release==='hardcrack'?5:3.5);
        x.beginPath(); x.moveTo(mx,my);
        x.lineTo(mx+Math.cos(ang)*len, my+Math.sin(ang)*len); x.stroke();
      }
      if(release==='hardcrack' && age<40){
        x.fillStyle='#fff'; x.beginPath(); x.arc(mx,my,cell*1.1,0,7); x.fill();
      }
      break;
    }
    case 'double': {
      const on = (age<80) || (age>150 && age<230);
      if(on){ x.fillStyle='#fff'; x.beginPath(); x.arc(mx,my,cell*1.3,0,7); x.fill(); }
      break;
    }
    case 'crumble': {
      const k=Math.min(1,age/900);
      x.fillStyle='rgba(160,160,160,'+((1-k)*0.5).toFixed(3)+')';
      for(let i=0;i<14;i++){
        const ang=(i/14)*Math.PI*2, r=cell*1.5*k;
        x.fillRect(mx+Math.cos(ang)*r-1, my+Math.sin(ang)*r*0.6-1, 2,2);
      }
      break;
    }
    case 'overexpose': {
      const k=Math.max(0,1-age/220);
      x.fillStyle='rgba(255,255,255,'+k.toFixed(3)+')';
      x.font=(cell*2)+'px "IV-dot",ui-monospace,monospace'; x.textAlign='center'; x.textBaseline='middle';
      x.fillText(pr.a.ch, mx-cell*0.7, my);
      x.fillText(pr.b.ch, mx+cell*0.7, my);
      break;
    }
    case 'strobe': {
      const flick = (Math.floor(age/45)%2===0) && age<420;
      if(flick){ x.fillStyle='#fff'; x.fillRect(0,0,W,H); }
      if(age>=420){
        x.fillStyle='#000'; x.fillRect(0,0,W,H);
      }
      break;
    }
  }
}

/* ---- gradient layers — depth on top of each page's flat ascii field.
   Three soft layers, all composited AFTER the character grid so the
   glyphs stay legible underneath: a vignette that pulls focus toward
   center, a slow-drifting tint-colored glow (additive, so it lifts
   rather than flattens), and a top/bottom atmosphere wash. All three
   deepen page to page — barely-there at 35, heaviest by 46, tracking
   the same climb the field strength and releases already make. ------ */
function drawGradientLayers(cfg, i){
  const [tr,tg,tb]=cfg.tint;
  const growth = i/(PAGES.length-1);   // 0 at 35 → 1 at 46

  const vg=x.createRadialGradient(W/2,H/2,Math.min(W,H)*0.12, W/2,H/2,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,'+(0.30+0.28*growth).toFixed(3)+')');
  x.fillStyle=vg; x.fillRect(0,0,W,H);

  const gx=W*0.5+Math.sin(tGlobal*0.00025+i)*W*0.26;
  const gy=H*0.42+Math.cos(tGlobal*0.00021+i*1.7)*H*0.22;
  const gg=x.createRadialGradient(gx,gy,0, gx,gy,Math.max(W,H)*0.5);
  gg.addColorStop(0,'rgba('+tr+','+tg+','+tb+','+(0.09+0.16*growth).toFixed(3)+')');
  gg.addColorStop(1,'rgba('+tr+','+tg+','+tb+',0)');
  const prevOp=x.globalCompositeOperation;
  x.globalCompositeOperation='lighter';
  x.fillStyle=gg; x.fillRect(0,0,W,H);
  x.globalCompositeOperation=prevOp;

  const at=x.createLinearGradient(0,0,0,H);
  at.addColorStop(0,'rgba(0,0,0,'+(0.10+0.24*growth).toFixed(3)+')');
  at.addColorStop(0.42,'rgba(0,0,0,0)');
  at.addColorStop(1,'rgba(0,0,0,'+(0.14+0.22*growth).toFixed(3)+')');
  x.fillStyle=at; x.fillRect(0,0,W,H);
}

/* ---- draw ---------------------------------------------------------- */
function draw(t){
  requestAnimationFrame(draw);
  if(!t0) t0=t;
  const dt=Math.min(48,t-t0); t0=t; tGlobal=t;

  x.clearRect(0,0,W,H);
  x.font=cell+'px "IV-dot",ui-monospace,monospace';
  x.textBaseline='middle'; x.textAlign='center';

  const cfg=PAGES[pageIdx];
  const [tr,tg,tb]=cfg.tint;

  // the whole-field engine, ported wholesale from effects-demo.html:
  // this page's OWN mode (its gesture's number) drives every cell on
  // screen, not just the ambient shimmer from before — displacement
  // genuinely displaces the field, bleed genuinely darkens it outward,
  // mirror genuinely doubles it. Touch anywhere to feel it, not just
  // near the two target letters.
  computeFieldFrame(dt);
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const k=i+j*cols;
      let v=F[k];
      if(fieldMode===5) v = Math.max(0,Math.min(1, base[k] + nap[k]*0.55*fieldStrength));
      let X=i*cell, Y=j*cell*1.15;
      if(fieldMode>=1&&fieldMode<=3){ X+=vel[k*2]*cell*0.30; Y+=vel[k*2+1]*cell*0.30; }
      if(fieldMode===0 && i===one.i && j===one.j){ X+=one.dx*cell; Y+=one.dy*cell*1.15; }
      if(v<0.02) continue;
      const fq=Math.max(0,Math.min(1,v))*(RAMP.length-1);
      const gi=Math.min(RAMP.length-1,Math.floor(fq));
      let a=(0.34+0.66*(fq-gi));
      let g=RAMP[gi];
      if(fieldMode===8||fieldMode===9) g=RAMP[fch[k]%RAMP.length];
      if(fieldMode===0 && i===one.i && j===one.j) a=1;
      x.fillStyle='rgba('+tr+','+tg+','+tb+','+Math.min(1,a*(0.35+0.65*v)).toFixed(3)+')';
      x.fillText(g,X,Y);
    }
  }
  drawGradientLayers(cfg, pageIdx);

  let allMet=true;
  for(const pr of pairs){
    const gesture=pr.gesture;
    if(!pr.met){
      allMet=false;
      applyGesture(pr, dt, gesture, pageIdx);
      checkContact(pr, gesture);
      if((gesture==='trail'||gesture==='peel') && pr.trail) for(const s of pr.trail){
        x.fillStyle='rgba(255,255,255,'+(0.3*s.a).toFixed(3)+')';
        x.fillText('.', s.x, s.y);
      }
      if(gesture==='mirror'){
        // effects-demo case 12: the far side answers. Each letter gets a
        // faint reflection across the vertical center — the pair still
        // meets normally, but the mirror makes contact feel uncanny
        // rather than purely direct, per the page's own design note.
        x.font=(cell*2.1)+'px "IV-dot",ui-monospace,monospace';
        x.fillStyle='rgba(255,255,255,0.22)';
        x.fillText(pr.a.ch, W-pr.a.x, pr.a.y);
        x.fillText(pr.b.ch, W-pr.b.x, pr.b.y);
      }
      if(gesture==='erode' && pr.erode>0){
        // visible grain where the barrier is wearing down — the crumble
        // release isn't the first sign of erosion, this is
        const mx=(pr.a.x+pr.b.x)/2, my=(pr.a.y+pr.b.y)/2;
        x.fillStyle='rgba(200,200,200,'+(pr.erode*0.5).toFixed(3)+')';
        const n=Math.floor(pr.erode*10);
        for(let i=0;i<n;i++){
          const ang=(i/10)*Math.PI*2+tGlobal*0.0008, r=cell*(1+pr.erode*1.5);
          x.fillRect(mx+Math.cos(ang)*r-1, my+Math.sin(ang)*r*0.6-1, 2,2);
        }
      }
      if(gesture==='bleed' && pr.bleed>0){
        // local ink pool for the pair itself — the whole-field mode
        // this page runs belongs to its FIRST pair; this second pair's
        // bleed still needs its own visible answer to holding it
        const mx=(pr.a.x+pr.b.x)/2, my=(pr.a.y+pr.b.y)/2;
        x.fillStyle='rgba(0,0,0,'+(pr.bleed*0.55).toFixed(3)+')';
        x.beginPath(); x.arc(mx,my,cell*(2.5+pr.bleed*5),0,7); x.fill();
      }
      x.font=(cell*2.1)+'px "IV-dot",ui-monospace,monospace';   // bigger than the field, on purpose
      for(const key of ['a','b']){
        const L=pr[key];
        // still on its own clock, but a shallow one — never dims enough to
        // get lost in the field the way the clutter is allowed to
        const v = 0.78 + 0.22*Math.sin(tGlobal/(900+ (key==='a'?0:130)) + (key==='a'?0:1.7));
        x.fillStyle='rgba(255,255,255,'+v.toFixed(3)+')';
        x.shadowColor='rgba(0,0,0,0.9)'; x.shadowBlur=cell*0.9;
        // flip tile: the glyph itself hasn't settled while it's flickering
        const dispCh = (gesture==='flip' && L.flipping) ? RAMP[(Math.random()*RAMP.length)|0] : L.ch;
        x.fillText(dispCh, L.x, L.y);
        x.shadowBlur=0;
      }
      x.font=cell+'px "IV-dot",ui-monospace,monospace';
    } else {
      const age = tGlobal-pr.releaseT;
      if(age < 1400) drawRelease(pr, cfg.release, age);
    }
  }

  // once every pair on the page is found, the page turns itself — no
  // tap needed. Give the release its own beat first (1400ms is the same
  // window drawRelease honors above) before the outro starts.
  if(allMet){
    if(!metAt) metAt=tGlobal;
    if(!trans && tGlobal-metAt>1400) startTransition(1);
  } else {
    metAt=0;
  }

  // the transition overlay — drawn last, on top of whichever page (old
  // until swapAt, new after) is currently rendering above
  if(trans){
    const age=tGlobal-trans.t0;
    const k=Math.min(1, age/trans.dur);
    if(!trans.swapped && k>=trans.swapAt){
      pageIdx=trans.toIdx; loadPage(pageIdx); trans.swapped=true;
    }
    drawTransition(trans.kind, k);
    if(k>=1) trans=null;
  }

  hud.textContent = 'p'+cfg.p+'  '+cfg.pairs.map(p=>p.letters.join('+')+':'+p.gesture).join(', ')+
    ' / '+cfg.release+
    (allMet ? '   — met'+(trans?'   turning…':'') : '');
}
size();
// canvas text can silently fall back to a system font if fillText runs
// before the @font-face has actually finished loading — and on some
// mobile browsers it never self-corrects once it's picked a fallback.
// Force the load and hold the first frame until it resolves.
let started=false;
function start(){ if(started) return; started=true; requestAnimationFrame(draw); }
if(document.fonts && document.fonts.load){
  document.fonts.load('16px "IV-dot"').catch(()=>{});
  document.fonts.ready.then(start).catch(start);
  setTimeout(start, 600);   // safety: don't hang forever if 'ready' never fires
} else start();

SEQ.mods['fever']={
  el:_root,
  start:function(){
    innerWidth=SEQ.vw(); innerHeight=SEQ.vh();
    _on=true; _root.style.display='block';
    (_L.resize||[]).forEach(function(f){f();});
    if(_pending){ var c=_pending; _pending=null; window.requestAnimationFrame(c); }
  },
  stop:function(){ _on=false; _root.style.display='none'; },
  resize:function(){ innerWidth=SEQ.vw(); innerHeight=SEQ.vh();
    (_L.resize||[]).forEach(function(f){f();}); },
  ev:function(t,e){ if(_on)(_L[t]||[]).forEach(function(f){f(e);}); }
};
})();

/* ===== hand (51) — locked file, untouched. Too different a document
   (own <body>, image, reset button, vibration loop) to splice into the
   canvas/hud closure pattern above, so it is mounted whole in a same-
   document iframe instead. The file itself is never edited. ===== */
(function(){
const _root=window.document.getElementById('seq-hand');
const _frame=_root.querySelector('iframe');
let _loaded=false;
SEQ.mods['hand']={
  el:_root,
  start:function(){
    _root.style.display='block';
    if(!_loaded){ _frame.src='./locked-hand-51.html'; _loaded=true; }
  },
  stop:function(){
    _root.style.display='none';
    _frame.src='about:blank';   // stop its vibration loop / reset state
    _loaded=false;
  },
  resize:function(){},
  ev:function(){}
};
})();
</script>
