<script>
/* ============================================================
   Locked sequences, mounted at their page numbers.

   Each locked file's script body is inlined verbatim inside its own
   closure. Nothing in a locked body is edited. What the closure
   supplies instead of the global scope:

     document.getElementById('c')  -> that module's own canvas
     innerWidth / innerHeight      -> visualViewport, not layout width
                                      (webviews lie — see craft findings)
     addEventListener              -> captured, replayed only while the
                                      module is the page on screen
     requestAnimationFrame         -> parked while the module is off screen,
                                      so four raycasters do not run at once

   Page spans come from INVOICE-book1-CURRENT-STATE.md, not from the repo:
   the repo still had placeholder accumulation pages at 28-29.
   ============================================================ */
const SEQ = {
  mods:{},
  vw:function(){ return VW(); },
  vh:function(){ return VH(); },
  /* 28-29 is ONE crate sequence; 47-48 is ONE NO sequence. Turning the
     page inside a span must not restart it. */
  at:{28:'crate',29:'crate',47:'no',48:'no',49:'hole',50:'collapse'},
  cur:null
};
const seqEl = document.getElementById('seq');
const blinkEl = document.getElementById('seq-blink');

/* Page 49 closes on the crate's blink. Constants copied verbatim from
   crate-LOCKED.html (c23) — the rhyme has to be exact or it is not one.
   OFFSET is the only number that is ours: where in the hole's twenty
   seconds the eyes start to close. 8300 puts the slow blink on 87% light
   and the fast blink on 37%, and the fade finishes behind shut eyes. */
const SEQ_BLINK = [ {at:2400,close:900,shut:700,open:1100},
                    {at:6600,close:220,shut:160,open:260} ];
const SEQ_BLINK_END = 8600;
const SEQ_BLINK_OFFSET = 8300;
function seqBlinkAt(ms){
  for (var i=0;i<SEQ_BLINK.length;i++){
    var B=SEQ_BLINK[i], p=ms-B.at;
    if (p<0) continue;
    if (p<B.close) return 1-p/B.close;
    p-=B.close; if (p<B.shut) return 0;
    p-=B.shut;  if (p<B.open) return p/B.open;
  }
  if (ms>SEQ_BLINK_END) return Math.max(0,1-(ms-SEQ_BLINK_END)/900);
  return 1;
}
let blinkT0=0;
function blinkFrame(t){
  if (SEQ.cur!=='hole'){ blinkT0=0; blinkEl.style.opacity='0'; return; }
  requestAnimationFrame(blinkFrame);
  if (!blinkT0) blinkT0=t;
  const age=t-blinkT0;
  const b=age<SEQ_BLINK_OFFSET?1:seqBlinkAt(age-SEQ_BLINK_OFFSET);
  blinkEl.style.opacity=(1-b).toFixed(4);
}

function seqShow(p){
  const want = SEQ.at[p] || null;
  if (want === SEQ.cur) return want;
  if (SEQ.cur && SEQ.mods[SEQ.cur]) SEQ.mods[SEQ.cur].stop();
  SEQ.cur = want;
  if (want){
    document.body.classList.add('seq');
    seqEl.style.display='block';
    SEQ.mods[want].start();
    if (want==='hole'){ blinkT0=0; requestAnimationFrame(blinkFrame); }
  } else {
    document.body.classList.remove('seq');
    seqEl.style.display='none';
    blinkEl.style.opacity='0';
  }
  return want;
}

/* the app's own field must not draw underneath a sequence */
const _drawField = drawField, _drawBurst = drawBurst;
drawField = function(t,p){ if (SEQ.cur) return; return _drawField(t,p); };
drawBurst = function(t){ if (SEQ.cur) return; return _drawBurst(t); };

const _showPage = showPage;
showPage = function(p){
  const r = _showPage(p);
  seqShow(p);
  return r;
};

addEventListener('resize', function(){
  if (SEQ.cur && SEQ.mods[SEQ.cur]) SEQ.mods[SEQ.cur].resize();
});
/* page 50 is the rotation gate — it needs the sensor, and only it does */
addEventListener('deviceorientation', function(e){
  if (SEQ.cur) SEQ.mods[SEQ.cur].ev('deviceorientation', e);
});
</script>
<script>

/* ===== crate — locked body, verbatim. Only the mount is ours. ===== */
(function(){
const _root=window.document.getElementById('seq-crate');
const _cv=_root.querySelector('canvas'), _hud=_root.querySelector('.seqhud');
const document={ getElementById:function(id){
    return id==='c'?_cv:(id==='hud'?_hud:window.document.getElementById(id)); },
  body:window.document.body,
  querySelector:function(s){ return window.document.querySelector(s); },
  createElement:function(s){ return window.document.createElement(s); } };
let innerWidth=SEQ.vw(), innerHeight=SEQ.vh();
let _on=false,_pending=null; const _L={};
function addEventListener(t,f){ (_L[t]=_L[t]||[]).push(f); }
function requestAnimationFrame(cb){
  if(_on) return window.requestAnimationFrame(cb);
  _pending=cb; return 0; }

/* ============================================================
   The crate, from outside — the only moment in Book 1 that leaves
   the narrator. He cannot see this. It is the first evidence there
   is an outside at all.

   Built the way the title cube is built: a real box, sampled face by
   face, projected ORTHOGRAPHICALLY and resolved with a z-buffer.
   Orthographic matters — edges stay straight and parallel and the
   faces stay true parallelograms. The previous version faked the
   faces as flat shapes and the eye could tell.

   The room is black. Only the crate has symbols. Every cell flips
   between 1 and 0 together, because that is what binary is: two
   states, and nothing between them.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d');
let cell=10, cols=0, rows=0, buf=null, zbuf=null;

function size(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  x.setTransform(dpr,0,0,dpr,0,0);
  cell=Math.max(7,Math.round(Math.min(innerWidth,innerHeight)/64));
  cols=Math.ceil(innerWidth/cell)+2;
  rows=Math.ceil(innerHeight/(cell*1.15))+2;
  buf=new Float32Array(cols*rows);
  zbuf=new Float32Array(cols*rows);
  built=false;
}

/* ---- the view ------------------------------------------------
   A fixed three-quarter view: front, right side and lid visible,
   matching the angle of the reference photograph.                */
const A = 0.34;              // pitch — how much lid is seen
/* Sampling must be fine enough that every character cell receives at least
   one sample. Too coarse and whole cells are skipped, which reads as dark
   streaks across the faces — an artifact, not shading. */
const STEP = 0.0085;

/* The view orbits before it travels. It begins on the far side, where
   there is no hole to see, and swings around until the face carrying
   the hole is square on. Only then does the frame move in.
   The reader finds the hole by going round the box, which is what you
   would do with a box. */
const B1 = 0.62;                       // the hole face, square on
const B0 = B1 - Math.PI*1.5;           // three faces earlier
let B = B0;

/* The hole. ONE shape, used from outside and from inside — it is the
   same hole, so it cannot change form as you pass through it. Irregular,
   because wood does not break in circles. */
const HOLE = { s:-0.40, t:0.44, r:0.177 };
function holeR(ang){
  return 1 + 0.22*Math.sin(ang*2+0.6)
           + 0.15*Math.sin(ang*3-1.4)
           + 0.09*Math.sin(ang*5+2.2);
}

function rot(i,j,k){
  const ca=Math.cos(A), sa=Math.sin(A), cb=Math.cos(B), sb=Math.sin(B);   // B animates
  const x1 =  i*cb + k*sb;
  const z1 = -i*sb + k*cb;
  const y2 =  j*ca - z1*sa;
  const z2 =  j*sa + z1*ca;
  return [x1, y2, z2];
}

/* Three planes that must differ enough to separate on their own,
   without any outline drawn between them. */
const FACE = { front:0.50, side:0.24, top:0.92, lidFront:0.68, lidSide:0.34 };

function project(px,py){
  return [0.5 + px*0.235, 0.5 + py*0.235*0.88];
}

/* ---- ray-cast the box ----------------------------------------
   Splatting samples from the faces onto the grid leaves edges ragged
   and faces speckled, because coverage per cell is uneven. So this
   works the other way: every screen cell asks the box what it is
   looking at. One test per cell, exact silhouette by construction,
   and fewer operations than sampling ever was.

   Orthographic, so all rays are parallel — only the entry point
   changes. The ray is rotated into the box's own space and
   intersected with it by the slab method.
   ------------------------------------------------------------- */
const SCALE = 0.235, ASPECT = 0.88;

function rayDir(){
  const ca=Math.cos(A), sa=Math.sin(A), cb=Math.cos(B), sb=Math.sin(B);
  return [-ca*sb, sa, ca*cb];              // dP/d(depth), in box space
}
function rayOrigin(X,Y){
  const ca=Math.cos(A), sa=Math.sin(A), cb=Math.cos(B), sb=Math.sin(B);
  const d=-4;
  const j = Y*ca + d*sa;
  const z1= -Y*sa + d*ca;
  const i = X*cb - z1*sb;
  const k = X*sb + z1*cb;
  return [i,j,k];
}

/* nearest hit on an axis-aligned box; returns [t, axis, sign] or null */
function hitBox(o,dir,hx,hy,hz){
  const lo=[-hx,-hy,-hz], hi=[hx,hy,hz];
  let tmin=-1e9, tmax=1e9, axis=0, sign=1;
  for(let n=0;n<3;n++){
    if (Math.abs(dir[n]) < 1e-9){
      if (o[n]<lo[n]||o[n]>hi[n]) return null;
      continue;
    }
    let t1=(lo[n]-o[n])/dir[n], t2=(hi[n]-o[n])/dir[n], sg=-1;
    if(t1>t2){ const tt=t1; t1=t2; t2=tt; sg=1; }
    if(t1>tmin){ tmin=t1; axis=n; sign=sg; }
    if(t2<tmax) tmax=t2;
    if(tmin>tmax) return null;
  }
  return [tmin, axis, sign];
}

const LID_T=0.11, OVER=1.06;

function shadeCell(X,Y){
  const dir=rayDir(), o=rayOrigin(X,Y);

  // the body
  const hb=hitBox(o,dir,1,1,1);
  // the lid, sitting on top and overhanging
  const oL=[o[0], o[1]+1+LID_T/2, o[2]];
  const hl=hitBox(oL,dir,OVER,LID_T/2,OVER);

  let use=null, isLid=false;
  if (hb && hl) { if (hl[0] < hb[0]) { use=hl; isLid=true; } else use=hb; }
  else if (hl) { use=hl; isLid=true; }
  else if (hb) use=hb;
  if (!use) return -1;

  const t=use[0], axis=use[1], sign=use[2];
  const p=[o[0]+dir[0]*t, o[1]+dir[1]*t, o[2]+dir[2]*t];

  if (isLid){
    if (axis===1) return 0.96;                       // lid top
    return axis===2 ? 0.66 : 0.36;                   // lid front / lid side
  }

  const rail = v => Math.abs(v) > 0.88 ? 1.32 : 1;

  if (axis===2){                                     // front or back
    const s=p[0], tt=p[1];
    const seam = Math.abs(((s+1)/0.27)%1 - 0.5) < 0.05 ? 0.45 : 1;
    if (sign < 0){                                   // the face with the hole
      const hdx=s-HOLE.s, hdy=(tt-HOLE.t)*0.9;
      const hang=Math.atan2(hdy,hdx);
      const hr=HOLE.r*holeR(hang);
      const d=Math.hypot(hdx,hdy);
      if (d < hr) return 0.02;                       // dark: the inside
      let a=FACE.front*seam*rail(tt);
      a += Math.max(0, 1-(d-hr)/0.10)*0.5;           // rim lit from within
      return Math.min(1,a);
    }
    return Math.min(1, FACE.front*seam*rail(tt));
  }

  if (axis===0){                                     // left or right wall
    const s=p[2], tt=p[1];
    const brace = Math.abs(tt - s*sign) < 0.15 ? 1.5 : 1;
    return Math.min(1, FACE.side*brace*rail(tt));
  }

  return sign>0 ? FACE.side*0.7 : FACE.top;          // floor / body top
}

/* where the hole lands on screen, so the travel can aim at it */
function holeScreen(){
  const [X,Y]=rot(HOLE.s,HOLE.t,-1);
  return [0.5 + X*SCALE, 0.5 + Y*SCALE*ASPECT];
}

const FLIP_MS = 1150;

/* A checkerboard — (rx+ry)&1 — is a perfectly regular pattern, and regular
   patterns of identical glyphs read as LINES rather than as texture. The dot
   face makes it worse, because its own dot rows align cell to cell as well.

   This is a stable hash instead: each cell keeps its own bit for as long as
   it exists, so nothing shimmers, but the arrangement has no lattice in it.
   Still two states, still flipping together. */
function cellBit(rx,ry){
  let h = (rx*374761393 + ry*668265263) | 0;
  h = (h ^ (h >> 13)) * 1274126177 | 0;
  return (h ^ (h >> 16)) & 1;
}
const T = { rise:2400, orbit:15000, settle:1400, sweepIn:600, sweep:5200,
            zoom:8000, black:1100, dark:800, out:6500 };
const IN_HOLE=0.115, IN_POS={x:0.34,y:0.60};

/* Once inside, the frame blinks: once slowly, once fast, and then it stays
   shut. An eye, or a light failing — the sequence reads as both, and the
   second blink being quicker is what makes the last darkness feel like a
   decision rather than a fade. */
const BLINK = [
  { at: 2400, close: 900, shut: 700, open: 1100 },   // slow
  { at: 6600, close: 220, shut: 160, open: 260  }    // fast
];
const BLINK_END = 8600;                              // then black, for good

function blinkAt(ms){
  for (let i=0;i<BLINK.length;i++){
    const B=BLINK[i];
    let p = ms - B.at;
    if (p < 0) continue;
    if (p < B.close)                    return 1 - p/B.close;
    p -= B.close;
    if (p < B.shut)                     return 0;
    p -= B.shut;
    if (p < B.open)                     return p/B.open;
  }
  if (ms > BLINK_END) return Math.max(0, 1-(ms-BLINK_END)/900);
  return 1;
}
let t0=0, built=false;

function inAperture(ang){ return IN_HOLE*holeR(ang); }   // the same shape
/* ---- wood grain ----------------------------------------------
   Grain covers the whole plank, not just the hole. Long lines run the
   length of the board; where they meet a knot they close into rings
   around it and straighten out again beyond. That is one field with
   local disturbances in it, not a pattern centred on anything.

   Two things make it read as timber rather than ripples:
   the space is WARPED before the banding is applied, so lines wander;
   and knots blend in by falloff, so their influence dies away instead
   of ending at an edge.
   ------------------------------------------------------------- */
const GRAIN = { freq:64.0, warpA:0.030, warpB:0.055, elong:5.5 };
const KNOTS = [
  { x:0.34, y:0.60, r:0.16, f:150 },   // the one the hole sits in
  { x:0.74, y:0.30, r:0.13, f:170 },
  { x:0.12, y:0.83, r:0.10, f:200 }
];

function grainAt(u,v){
  // warp first — this is what makes grain wander like wood
  const wu = u + GRAIN.warpA*Math.sin(v*7.3 + u*2.1)
               + GRAIN.warpB*0.4*Math.sin(v*17.0 - 1.2);
  const wv = v + GRAIN.warpA*0.5*Math.sin(u*9.1 + 0.7);

  // the length of the board: long lines running across it
  let g = wv*GRAIN.freq + Math.sin(wu*2.4)*2.2;

  // knots pull the lines into rings, and let go again
  for (let i=0;i<KNOTS.length;i++){
    const K=KNOTS[i];
    const dx=wu-K.x, dy=wv-K.y;
    const d2=dx*dx+dy*dy;
    const w=Math.exp(-d2/(K.r*K.r));
    if (w < 0.01) continue;
    const rd=Math.sqrt(dx*dx*GRAIN.elong*GRAIN.elong + dy*dy);
    g = g*(1-w) + rd*K.f*w;
  }

  // early wood soft, late wood hard — asymmetric, like real rings
  const band = Math.sin(g);
  return 0.26 + 0.74*Math.pow(Math.abs(band), 0.5);
}

function draw(t){
  requestAnimationFrame(draw);
  if(!t0){ t0=t; built=false; }
  const age=t-t0;
  const W=innerWidth, H=innerHeight;


  x.clearRect(0,0,W,H);
  x.font=cell+'px "IV-dot",ui-monospace,monospace';
  x.textBaseline='top';

  const flip=Math.floor(age/FLIP_MS)&1;
  const rise=Math.min(1,age/T.rise);

  // orbit first — eased at both ends so it arrives rather than stops
  const ot0=Math.max(0,Math.min(1,(age-T.rise)/T.orbit));
  const eased=ot0*ot0*(3-2*ot0);
  const wantB=B0+(B1-B0)*eased;
  B = wantB;                     // nothing to rebuild — shading is per cell

  const zStart=T.rise+T.orbit+T.settle+T.sweepIn+T.sweep;
  const zt=Math.max(0,Math.min(1,(age-zStart)/T.zoom));
  const scale=Math.exp(zt*Math.log(52));
  const out=Math.max(0,Math.min(1,(age-zStart-T.zoom)/T.black));
  const vis=rise*(1-out);
  const sweepT=Math.max(0,Math.min(1,
      (age-T.rise-T.orbit-T.settle-T.sweepIn)/T.sweep));

  // ---- inside: the same passage, continuing outward
  const outStart=zStart+T.zoom+T.black+T.dark;
  if (age>outStart){
    const ot=Math.min(1,(age-outStart)/T.out);
    const isc=Math.exp((1-ot)*Math.log(52));
    let iv=Math.min(1,(age-outStart)/900);
    if (ot >= 1) iv *= blinkAt(age-outStart-T.out);   // blink only once settled
    const R0=Math.min(W,H), cxp=W*IN_POS.x, cyp=H*IN_POS.y;
    for(let ry=0;ry<rows;ry++){
      const py=ry*cell*1.15;
      for(let rx=0;rx<cols;rx++){
        const px=rx*cell;
        const sx=cxp+(px-cxp)/isc, sy=cyp+(py-cyp)/isc;
        const dx=(sx-cxp)/R0, dy=(sy-cyp)/R0*0.82;
        const r=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
        const edge=inAperture(ang);
        if(r<edge*0.94) continue;
        const g=grainAt(sx/W,sy/H);
        const fe=(r-edge)/(IN_HOLE*0.8);
        let a=g*0.07 + Math.max(0,1-fe*fe)*g*0.85;
        a*=(0.68+0.32*(px/W))*iv;
        if(a<0.012) continue;
        x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
        x.fillText((cellBit(rx,ry)^flip)?'1':'0',px,py);
      }
    }
    x.save(); x.beginPath();
    for(let i=0;i<=200;i++){
      const a2=(i/200)*Math.PI*2, rr=inAperture(a2)*0.94*R0*isc;
      const qx=cxp+Math.cos(a2)*rr, qy=cyp+Math.sin(a2)*rr/0.82;
      i?x.lineTo(qx,qy):x.moveTo(qx,qy);
    }
    x.closePath();
    x.globalCompositeOperation='destination-over';
    x.fillStyle='rgba(255,255,255,'+(0.92*iv).toFixed(3)+')';
    x.fill(); x.globalCompositeOperation='source-over'; x.restore();
    return;
  }

  // ---- outside
  // Sample per SCREEN cell, not per buffer cell. Scaling a rendered grid
  // outward spreads a fixed number of characters over a growing area and
  // opens gaps; asking each screen cell what lies behind it keeps the
  // density constant at every magnification. Inverse mapping, not forward.
  const [hx,hy]=holeScreen();
  for(let ry=0;ry<rows;ry++){
    const py=ry*cell*1.15;
    for(let rx=0;rx<cols;rx++){
      const px=rx*cell;

      // screen -> the crate's own projected space
      const u0 = hx + (px/W - hx)/scale;
      const v0 = hy + (py/H - hy)/scale;

      // ...and straight into the box: no buffer, no splatting
      let a = shadeCell((u0-0.5)/SCALE, (v0-0.5)/(SCALE*ASPECT));
      if(a<=0) continue;

      // the shadow, travelling left to right across the crate
      const sd=Math.abs(u0-(sweepT*1.5-0.25))/0.20;
      a*=1-Math.max(0,1-sd*sd)*0.78;
      a*=(0.70+0.30*u0)*vis;

      if(a<0.012) continue;
      x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
      x.fillText((cellBit(rx,ry)^flip)?'1':'0',px,py);
    }
  }
}

function requestAnimationFrame(cb){
  if(_on) return window.requestAnimationFrame(cb);
  _pending=cb; return 0; }

/* ============================================================
   The first word is not written. It is collided into being.

   The page is half N and half 0. The two halves advance on each
   other — slowly, so the reader has time to see what is coming
   before it arrives. Where they meet, they burst, and the burst is
   made of the same two characters and nothing else.

   Then black. Then NO fades up, having already happened.

   N comes from the dark side and 0 from the light side, so they
   arrive in reading order. And the O is a 0 — the word is one
   letter and one digit, half language and half binary, which is the
   state of the whole book at this point.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d'), hud=document.getElementById('hud');
let W=0,H=0,cell=0,cols=0,rows=0,seed=null;

/* ---- the crate, at the centre --------------------------------
   The two halves close ON the box — the refusal converging on the
   thing being refused — and the burst comes out of it because that
   is where they met. Same box as pages 28-29, ray-cast the same way.
   ------------------------------------------------------------- */
const RAMP=" .,-~:_;!I|/1TL7JY?FVCZS3AXK2UP0O548EG9H6RDQBNWM";
/* Same view as before — only the projection is fixed. The vertical scale
   was 0.9 of the horizontal, which squashed a true cube into a box. A cube
   in geometry still reads as a box if the projection is not isotropic. */
const A=0.34, B=0.62, BOXR=0.115;   // the original view, unchanged
function rayDir(){
  const ca=Math.cos(A),sa=Math.sin(A),cb=Math.cos(B),sb=Math.sin(B);
  return [-ca*sb, sa, ca*cb];
}
function rayOrigin(X,Y){
  const ca=Math.cos(A),sa=Math.sin(A),cb=Math.cos(B),sb=Math.sin(B);
  const d=-4, j=Y*ca+d*sa, z1=-Y*sa+d*ca;
  return [X*cb-z1*sb, j, X*sb+z1*cb];
}
function hitBox(o,dir,h){
  let tmin=-1e9,tmax=1e9,axis=0,sign=1;
  for(let n=0;n<3;n++){
    if(Math.abs(dir[n])<1e-9){ if(o[n]<-h||o[n]>h) return null; continue; }
    let t1=(-h-o[n])/dir[n], t2=(h-o[n])/dir[n], sg=-1;
    if(t1>t2){const tt=t1;t1=t2;t2=tt;sg=1;}
    if(t1>tmin){tmin=t1;axis=n;sign=sg;}
    if(t2<tmax) tmax=t2;
    if(tmin>tmax) return null;
  }
  return [tmin,axis,sign];
}
function crateAt(X,Y){
  const h=hitBox(rayOrigin(X,Y),rayDir(),1);
  if(!h) return -1;
  const axis=h[1], sign=h[2];
  if(axis===1) return sign<0?0.90:0.30;      // lid / floor
  if(axis===2) return 0.48;                  // front, back
  return 0.25;                               // sides
}

function size(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(d,0,0,d,0,0);
  cell=Math.max(8,Math.round(Math.min(W,H)/48));
  cols=Math.ceil(W/cell)+1; rows=Math.ceil(H/(cell*1.15))+1;
  seed=new Float32Array(cols*rows);
  for(let i=0;i<seed.length;i++)
    seed[i]=Math.abs(Math.sin(i*12.9898)*43758.5453)%1;
}
size(); addEventListener('resize',size);

/* ---- timing --------------------------------------------------
   The approach is long on purpose: the reader should watch it
   coming. The burst is short. The word arrives last and stays. */
/* No black between the burst and the word. The field never goes away —
   it settles out of the burst into a mix, and the word comes up on the
   same screen. Cutting to black and back made them two events; this
   makes them one. */
const T={ hold:900, close:9000, burst:2600, dark:0, word:4200 };
const TOTAL=T.hold+T.close+T.burst+T.dark+T.word;
let t0=0;

/* rays for the burst — uneven, gapped, starting away from centre */
const RAYS=[];
(function(){
  const N=46;
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2 + Math.sin(i*12.9898)*0.06;
    RAYS.push({a, len:0.25+1.25*Math.pow(Math.abs(Math.sin(i*2.7+0.4)),0.6),
               w:0.30+0.70*Math.abs(Math.sin(i*5.1+2)),
               sp:0.7+0.6*Math.abs(Math.sin(i*1.7))});
  }
})();

function draw(t){
  requestAnimationFrame(draw);
  if(!t0) t0=t;
  let age=(t-t0)%TOTAL;

  x.clearRect(0,0,W,H);
  x.font=cell+'px "IV-dot",ui-monospace,monospace';
  x.textAlign='center'; x.textBaseline='middle';
  const cx=W*0.5, cy=H*0.5;

  // --- phase 1: the two halves close on each other
  let close=0;
  if(age>T.hold) close=Math.min(1,(age-T.hold)/T.close);
  const eased=close*close*(3-2*close);          // slow at both ends

  const inBurst = age > T.hold+T.close && age <= T.hold+T.close+T.burst;
  const bAge = inBurst ? (age-T.hold-T.close)/T.burst : 0;
  const afterBurst = age > T.hold+T.close+T.burst;
  const wordStart = T.hold+T.close+T.burst;
  const wordAge = age > wordStart ? (age-wordStart)/T.word : 0;

  // the mixed field comes up UNDER the burst, so nothing ever cuts to black
  const mixIn = age > T.hold+T.close+T.burst*0.45
    ? Math.min(1,(age-(T.hold+T.close+T.burst*0.45))/(T.burst*0.7)) : 0;

  /* ONE field, drawn every frame, start to finish. The cells that sweep
     in are the same cells that mix, and the same cells the word comes up
     over. Nothing is ever replaced — before, the mix was a second field
     that arrived after the first was discarded, and that reads as a cut
     however it is faded. */
  {
    const gap = 0.5 - 0.56*eased;               // negative: they overlap
    const boxHalf = BOXR*0.62;                  // they close ON the crate
    // after the collision each cell forgets which half it came from, on
    // its own clock, so the sorting dissolves rather than switching
    const scramble = afterBurst
      ? Math.min(1,(age-(T.hold+T.close+T.burst*0.4))/(T.burst*1.1)) : 0;

    x.font=cell+'px "IV-dot",ui-monospace,monospace';
    for(let j=0;j<rows;j++){
      const py=j*cell*1.15;
      for(let i=0;i<cols;i++){
        const k=i+j*cols, u=i/(cols-1);

        let side;
        const inN = u < 0.5-gap, inO = u > 0.5+gap;
        if(inN && inO) side = (seed[k] < 0.5) ? -1 : 1;   // the overlap
        else if(inN)  side = -1;
        else if(inO)  side = 1;
        else if(!afterBurst) continue;                    // not yet arrived
        else side = (seed[k] < 0.5) ? -1 : 1;

        if(scramble > 0){
          const own = (seed[k]*7.13 + age*0.00055*(0.4+seed[k]))%1;
          if (own < scramble*0.5) side = -side;
        }

        let a=(0.14+0.52*seed[k])*(0.30+0.70*u);
        if(!afterBurst){
          const edge = side<0 ? (u/(0.5-gap+1e-6)) : ((1-u)/(0.5-gap+1e-6));
          a *= 0.45 + 0.55*eased + 0.5*Math.pow(Math.max(0,edge),6)*eased;
        } else {
          a *= 0.55 + 0.25*Math.sin(age*0.0016 + seed[k]*20);
        }
        if(a<0.02) continue;
        x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
        x.fillText(side<0?'N':'0', i*cell, py);
      }
    }
  }

  // the crate — present from the start, whitening as the light leaves it
  {
    const blow = inBurst ? Math.pow(bAge,0.5) : (afterBurst ? 1 : 0);
    const vis  = afterBurst ? Math.max(0,1-(age-(T.hold+T.close+T.burst))/1400) : 1;
    if (vis>0.02){
      x.font=cell+'px "IV-dot",ui-monospace,monospace';
      const S=Math.min(W,H)*BOXR;
      for(let j=0;j<rows;j++){
        const py=j*cell*1.15;
        for(let i=0;i<cols;i++){
          const pxx=i*cell;
          const cA=crateAt((pxx-cx)/S,(py-cy)/S);   // square: same scale both ways
          if(cA<0) continue;
          const a=Math.min(1, cA*0.9 + blow*0.9)*vis*(0.45+0.55*(pxx/W));
          if(a<0.02) continue;
          const g=RAMP[Math.min(RAMP.length-1,Math.round(a*(RAMP.length-1)))];
          x.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
          x.fillText(g,pxx,py);
        }
      }
    }
  }

  // --- phase 2: they meet, and burst — in N and 0 only
  if(inBurst){
    const k=Math.pow(bAge,0.6), fade=1-Math.pow(bAge,2.2);
    const R0=Math.hypot(W,H)*0.5, start=cell*1.2;
    for(const r of RAYS){
      const reach=start+R0*r.len*k*r.sp;
      const ca=Math.cos(r.a), sa=Math.sin(r.a);
      for(let d=start; d<reach; d+=cell*0.72){
        const px=cx+ca*d, py=cy+sa*d*0.92;
        if(px<-cell||px>W+cell||py<-cell||py>H+cell) continue;
        const along=(d-start)/Math.max(1,reach-start);
        let a=Math.pow(1-along,1.15)*r.w*fade*(0.45+0.55*(px/W));
        if(a<0.025) continue;
        x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
        // the burst is made of the two characters that caused it
        x.fillText(((d/cell)|0)%2 ? 'N':'0', px, py);
      }
    }
    const cr=cell*(1.2+6*k);
    const gr=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(1,cr));
    gr.addColorStop(0,'rgba(255,255,255,'+(0.95*fade).toFixed(3)+')');
    gr.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=gr; x.fillRect(0,0,W,H);
  }

  // --- phase 3: black, then the word, having already happened
  if(wordAge>0){
    // It does not simply appear — it comes toward you, out of black and
    // out of nothing, and keeps growing. A word that arrives at a fixed
    // size has been placed there. A word that approaches was already
    // travelling.
    const w=Math.min(1,wordAge);
    const ease=1-Math.pow(1-w,2.2);
    const a=Math.min(1, wordAge*2.2);
    const s=cell*(1.1 + 9.5*ease);
    x.font=s+'px "IV-dot",ui-monospace,monospace';
    x.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
    x.fillText('NO', cx, cy);
  }
}

/* ============================================================
   The hole.

   Zoomed in far enough that the crate has no extent — there is no
   box, only an opening and whatever is behind it. The wood is dense
   character mass; the hole is where the characters stop. Light does
   not shine ON anything. It is simply what is on the other side.

   It arrives, holds, and goes. Nothing is revealed about the room.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d');
let cols=0, rows=0, cell=0, grain=[];

function size(){
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  x.setTransform(dpr,0,0,dpr,0,0);
  cell=Math.max(9,Math.round(Math.min(innerWidth,innerHeight)/56));
  cols=Math.ceil(innerWidth/cell)+1;
  rows=Math.ceil(innerHeight/(cell*1.15))+1;
  buildGrain();
}

/* wood grain: long horizontal streaks, because grain runs with the plank.
   value per cell 0..1, used as density. */
function buildGrain(){
  grain=[];
  for(let y=0;y<rows;y++){
    const row=[];
    const band = Math.sin(y*0.55)*0.5 + Math.sin(y*0.17+1.3)*0.5;
    for(let x0=0;x0<cols;x0++){
      const streak = Math.sin(x0*0.04 + y*0.9)*0.25
                   + Math.sin(x0*0.011 + band*3.0)*0.35;
      const knot = Math.sin(x0*0.13+y*0.31)*0.18;
      row.push({
        v: 0.5 + streak*0.5 + knot,
        ch: Math.random()<0.5?'0':'1'
      });
    }
    grain.push(row);
  }
}
size(); addEventListener('resize',size);

/* the aperture: an irregular closed curve, wood opened from the inside.
   radius varies with angle — never a circle, never symmetrical. */
const HOLE = 0.072;                 // fraction of the short edge

/* Where the hole sits. Low, and to one side — dead centre reads as a target
   and gives the light nowhere to travel. Left is the stronger side: the
   light enters at the dark end of the gradient and has the whole frame to
   cross. Set HOLE_X to 0.72 to put it on the right instead. */
const HOLE_X = 0.28, HOLE_Y = 0.70;
function apertureR(ang){
  return HOLE * (1
       + 0.24*Math.sin(ang*2.0 + 0.6)
       + 0.17*Math.sin(ang*3.0 - 1.4)
       + 0.10*Math.sin(ang*5.0 + 2.2)
       + 0.06*Math.sin(ang*8.0 - 0.3));
}

/* ---- timing -------------------------------------------------- */
const T = { dark:1400, rise:5200, hold:4200, fall:9000 };
let t0=0;

function lightAt(age){
  if (age < T.dark) return 0;
  age -= T.dark;
  if (age < T.rise) return Math.pow(age/T.rise, 1.8);   // slow to arrive
  age -= T.rise;
  if (age < T.hold) return 1;
  age -= T.hold;
  if (age < T.fall) return Math.pow(1-age/T.fall, 1.5); // slower to leave
  return 0;
}

function draw(t){
  requestAnimationFrame(draw);
  if(!t0) t0=t;
  const L = lightAt(t-t0);

  x.clearRect(0,0,innerWidth,innerHeight);
  x.font=cell+'px ui-monospace,monospace';
  x.textBaseline='top';

  const W=innerWidth, H=innerHeight;
  const cxp=W*HOLE_X, cyp=H*HOLE_Y;
  const R0=Math.min(W,H);

  for(let y=0;y<rows;y++){
    const py=y*cell*1.15;
    for(let x0=0;x0<cols;x0++){
      const px=x0*cell;
      const dx=(px-cxp)/R0, dy=(py-cyp)/R0;
      // The radius is measured in squashed space (dy scaled), so the angle
      // must be too — otherwise the mask and the filled shape describe two
      // different ellipsoids and characters land inside the light.
      const sy=dy*0.82;
      const r=Math.hypot(dx,sy);
      const ang=Math.atan2(sy,dx);
      const edge=apertureR(ang);
      const g=grain[y][x0];

      // inside the hole there is no wood — only what is behind it
      if (r < edge*0.94) continue;

      // the rim catches the light; the far wood barely does
      const fromEdge = (r - edge)/(HOLE*0.85);        // rim scales with the hole
      const rim = Math.max(0, 1 - fromEdge*fromEdge);

      // ambient wood, always faintly there, so the dark is occupied
      let a = g.v * 0.055;
      // and the light behind the hole, spilling onto the rim only
      a += rim * L * g.v * 0.85;

      if (a < 0.012) continue;
      x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
      x.fillText(g.ch, px, py);
    }
  }

  // What is behind. Light through an opening has a HARD edge, and the
  // edge is the hole itself — not a falloff. Softness belongs only at the
  // rim, where it grazes the wood. So the aperture is filled as a shape.
  if (L > 0.002){
    x.save();
    x.beginPath();
    const N=240;
    for(let i=0;i<=N;i++){
      const ang=(i/N)*Math.PI*2;
      // same space as the mask above, inverted back into screen coords
      const rr=apertureR(ang)*0.94*R0;
      const px=cxp+Math.cos(ang)*rr;
      const py=cyp+Math.sin(ang)*rr/0.82;
      i?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.closePath();
    x.globalCompositeOperation='destination-over';
    // very slightly brighter toward the right — the law holds even here
    const gl=x.createLinearGradient(cxp-R0*HOLE,0,cxp+R0*HOLE,0);
    gl.addColorStop(0,'rgba(255,255,255,'+(0.80*L).toFixed(3)+')');
    gl.addColorStop(1,'rgba(255,255,255,'+(1.00*L).toFixed(3)+')');
    x.fillStyle=gl;
    x.fill();
    x.globalCompositeOperation='source-over';
    x.restore();
  }
}
requestAnimationFrame(draw);
addEventListener('touchend',()=>{t0=0;},{passive:true});
addEventListener('click',()=>{t0=0;});

SEQ.mods['hole']={
  el:_root,
  start:function(){
    innerWidth=SEQ.vw(); innerHeight=SEQ.vh();
    _on=true; _root.style.display='block';
    (_L.resize||[]).forEach(function(f){f();});
    (_L.click||[]).forEach(function(f){f();});      /* the file's own replay path */
    if(_pending){ var c=_pending; _pending=null; window.requestAnimationFrame(c); }
  },
  stop:function(){ _on=false; _root.style.display='none'; },
  resize:function(){ innerWidth=SEQ.vw(); innerHeight=SEQ.vh();
    (_L.resize||[]).forEach(function(f){f();}); },
  ev:function(t,e){ if(_on)(_L[t]||[]).forEach(function(f){f(e);}); }
};
})();

/* ===== collapse — locked body, verbatim. Only the mount is ours. ===== */
(function(){
const _root=window.document.getElementById('seq-collapse');
const _cv=_root.querySelector('canvas'), _hud=_root.querySelector('.seqhud');
const document={ getElementById:function(id){
    return id==='c'?_cv:(id==='hud'?_hud:window.document.getElementById(id)); },
  body:window.document.body,
  querySelector:function(s){ return window.document.querySelector(s); },
  createElement:function(s){ return window.document.createElement(s); } };
let innerWidth=SEQ.vw(), innerHeight=SEQ.vh();
let _on=false,_pending=null; const _L={};
function addEventListener(t,f){ (_L[t]=_L[t]||[]).push(f); }
function requestAnimationFrame(cb){
  if(_on) return window.requestAnimationFrame(cb);
  _pending=cb; return 0; }

/* ============================================================
   PAGE 50 — the collapse.

   The reader has spent 45 pages acquiring a language. Here the page
   itself stops holding it up: every character becomes a body, gravity
   arrives with the turn of the device, and what the characters strike
   on the way down takes their identity from them. What settles is 0s
   and 1s, because that is all that survives being dropped.

   The gate is the turn. It cannot be tapped through — the reader's
   posture has to change, not their finger. Nothing says so; they were
   taught this at the start of the book and never told again.

   The gate keys off the TILT SENSOR, not the viewport: a phone with
   rotation lock on never re-lays-out, and that reader must not be
   stranded.
   ============================================================ */
const cv=document.getElementById('c'), x=cv.getContext('2d'), hud=document.getElementById('hud');
let W=0,H=0,cell=0;

function size(){
  const d=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(d,0,0,d,0,0);
  cell=Math.max(9,Math.round(Math.min(W,H)/44));
}
size(); addEventListener('resize',()=>{size();});

/* ---- gravity, from the device ------------------------------- */
let gAng=0, haveTilt=false, shownAng=0, lastT=0;
function screenAngle(){
  if (screen.orientation && typeof screen.orientation.angle==='number')
    return screen.orientation.angle*Math.PI/180;
  if (typeof window.orientation==='number') return window.orientation*Math.PI/180;
  return 0;
}
addEventListener('deviceorientation', e=>{
  if(e.gamma===null||e.beta===null) return;
  haveTilt=true;
  const b=e.beta*Math.PI/180, g=e.gamma*Math.PI/180;
  let a=Math.atan2(Math.sin(g), -Math.sin(b)*Math.cos(g)) - screenAngle();
  while(a> Math.PI) a-=Math.PI*2;
  while(a<-Math.PI) a+=Math.PI*2;
  gAng=a;
}, true);

/* how far the device has turned from upright, 0..1 */
function turned(){ return Math.min(1, Math.abs(Math.sin(shownAng))); }

/* ---- the characters, as bodies ------------------------------ */
const VOCAB=".,:;-_!?0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const parts=[];
function build(){
  parts.length=0;
  const cols=Math.floor(W/cell)-1, rows=Math.floor(H/(cell*1.15))-1;
  for(let ry=0; ry<rows; ry++){
    for(let rx=0; rx<cols; rx++){
      // the page as the reader left it: dense to the right, per the law
      const u=rx/cols;
      if (Math.random() > 0.22+0.55*u) continue;
      parts.push({
        x:(rx+1)*cell, y:(ry+1)*cell*1.15, vx:0, vy:0,
        ch:VOCAB[(Math.random()*VOCAB.length)|0],
        id:1,                       // how much of itself it still is
        bit:Math.random()<0.5?'0':'1',
        r:cell*0.46, rest:0, woke:0
      });
    }
  }
}

/* ---- collisions ---------------------------------------------
   A spatial hash, so each body only tests against its neighbours.
   Testing every pair would be 200,000 tests a frame at this count. */
const grid=new Map();
function key(i,j){ return i+','+j; }
function hash(){
  grid.clear();
  const s=cell;
  for(const p of parts){
    const k=key(Math.floor(p.x/s), Math.floor(p.y/s));
    let a=grid.get(k); if(!a){ a=[]; grid.set(k,a); }
    a.push(p);
  }
}
function neighbours(p){
  const s=cell, i=Math.floor(p.x/s), j=Math.floor(p.y/s), out=[];
  for(let di=-1;di<=1;di++) for(let dj=-1;dj<=1;dj++){
    const a=grid.get(key(i+di,j+dj)); if(a) out.push(...a);
  }
  return out;
}

let running=false, started=0, settledAt=0;

function step(dt){
  // dt is used by the loss above
  const k=turned();
  // gravity arrives WITH the turn — upright, nothing falls
  const g = 820*k;
  const gx=Math.sin(shownAng)*g, gy=Math.cos(shownAng)*g;

  for(const p of parts){
    p.vx+=gx*dt; p.vy+=gy*dt;

    // Friction rises sharply once a body is slow. Without this a pile never
    // stops — it creeps for ever on the residue of its own collisions.
    const sp=Math.hypot(p.vx,p.vy);
    // Heavy damping ONLY near rest. Applying it across a wide speed band
    // sets a terminal velocity — at 0.80 below 150 the algebra caps every
    // body at about 52 px/s, which is too slow to lose identity and too
    // fast to fall asleep. One number was suppressing both behaviours.
    const damp = sp < 45 ? 0.86 : 0.995;
    p.vx*=damp; p.vy*=damp;

    // rest detection: a body that has been slow for a while is asleep.
    // without this a deep pile churns for ever on its own contact noise.
    // A body can only fall asleep if it has been awake. Checking speed
    // alone deadlocks: everything starts at rest, so everything sleeps
    // before gravity has a chance to move it.
    if (sp > 110) p.woke = 1;
    if (p.woke && sp < 62){ p.rest++; if(p.rest>10){ p.vx=0; p.vy=0; } }
    else p.rest=0;

    // what tumbling costs
    if (sp > LOSS_MIN && p.id > 0){
      p.id -= LOSS_RATE * dt * Math.min(1.6, sp/240);
      if (p.id < 0) p.id = 0;
    }

    p.x+=p.vx*dt; p.y+=p.vy*dt;

    // the walls of the device
    const b=0.18;                       // bounce, almost none
    if(p.x<p.r){ p.x=p.r; p.vx=-p.vx*b; }
    if(p.x>W-p.r){ p.x=W-p.r; p.vx=-p.vx*b; }
    if(p.y<p.r){ p.y=p.r; p.vy=-p.vy*b; }
    if(p.y>H-p.r){ p.y=H-p.r; p.vy=-p.vy*b; }
  }

  hash();
  for(const p of parts){
    for(const q of neighbours(p)){
      if(q===p) continue;
      const dx=q.x-p.x, dy=q.y-p.y;
      const d2=dx*dx+dy*dy, rr=p.r+q.r;
      if(d2>=rr*rr || d2<1e-6) continue;
      const d=Math.sqrt(d2), n=(rr-d)/d*0.5;
      p.x-=dx*n; p.y-=dy*n; q.x+=dx*n; q.y+=dy*n;
      const rvx=q.vx-p.vx, rvy=q.vy-p.vy;
      const imp=(rvx*dx+rvy*dy)/d*0.42;
      p.vx+=dx/d*imp*0.32; p.vy+=dy/d*imp*0.32;
      q.vx-=dx/d*imp*0.32; q.vy-=dy/d*imp*0.32;
    }
  }
}

/* Collision impulses turned out to be a poor signal — too spiky, too
   dependent on how deep a body sits in the pile. Identity is spent by
   MOTION instead: a character loses itself while it is tumbling, and
   keeps whatever is left once it comes to rest.

   Same reading, far easier to pace — and the pacing is the point, because
   the reader should watch the alphabet die rather than find it dead. */
function lose(){}                                  // no longer used

const LOSS_RATE = 0.30;     // identity per second at full tumble
const LOSS_MIN  = 70;       // below this speed, nothing is lost

function draw(t){
  requestAnimationFrame(draw);
  const dt=Math.min(0.032,(t-lastT)/1000)||0.016; lastT=t;

  // ease the sensor, on a time constant so 60Hz and 120Hz agree
  const target = haveTilt ? gAng : (W>H ? Math.PI/2 : 0);
  let d=target-shownAng;
  while(d> Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  shownAng += d*(1-Math.exp(-dt*1000/95));

  if(running) step(dt);

  x.clearRect(0,0,W,H);
  x.font=cell+'px "IV-dot",ui-monospace,monospace';
  x.textAlign='center'; x.textBaseline='middle';

  let stillLanguage=0, moving=0;
  for(const p of parts){
    // identity decides which character it still is
    const isWord = p.id > 0.5;
    if(isWord) stillLanguage++;
    if(Math.hypot(p.vx,p.vy)>18) moving++;
    const ch = isWord ? p.ch : p.bit;
    const a = (0.30+0.70*(p.x/W)) * (isWord ? 0.55+0.45*p.id : 0.92);
    x.fillStyle='rgba(255,255,255,'+Math.min(1,a).toFixed(3)+')';
    x.fillText(ch, p.x, p.y);
  }

  const k=turned();
  hud.textContent='p50  '+(haveTilt?'tilt':'no-tilt')
    +'  turned '+k.toFixed(2)
    +'  language '+Math.round(100*stillLanguage/Math.max(1,parts.length))+'%'
    +'  moving '+moving;
}

function start(){
  if(running) return;
  size(); build(); running=true; started=performance.now();
  const go=()=>{};
  if (typeof DeviceOrientationEvent!=='undefined' &&
      typeof DeviceOrientationEvent.requestPermission==='function')
    DeviceOrientationEvent.requestPermission().then(go).catch(go);
}
requestAnimationFrame(draw);
addEventListener('touchend',e=>{e.preventDefault(); running?0:start();});
addEventListener('click',()=>{ running?0:start(); });

SEQ.mods['collapse']={
  el:_root,
  start:function(){
    innerWidth=SEQ.vw(); innerHeight=SEQ.vh();
    _on=true; _root.style.display='block';
    (_L.resize||[]).forEach(function(f){f();});
    (_L.click||[]).forEach(function(f){f();});      /* the file's own replay path */
    if(_pending){ var c=_pending; _pending=null; window.requestAnimationFrame(c); }
  },
  stop:function(){ _on=false; _root.style.display='none'; },
  resize:function(){ innerWidth=SEQ.vw(); innerHeight=SEQ.vh();
    (_L.resize||[]).forEach(function(f){f();}); },
  ev:function(t,e){ if(_on)(_L[t]||[]).forEach(function(f){f(e);}); }
};
})();
</script>
