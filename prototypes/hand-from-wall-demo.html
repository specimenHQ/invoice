<title>Hand Animation</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b0b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    gap: 24px;
    padding: 24px;
    box-sizing: border-box;
  }
  .frame {
    max-width: 360px;
    width: 100%;
    aspect-ratio: 1168 / 2076;
    background: white;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  button {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06);
    color: #f2f2f2;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: rgba(255,255,255,0.14); }
  button:active { transform: scale(0.96); }
  .hint {
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    text-align: center;
    max-width: 280px;
  }
</style>

<button id="resetBtn">Reset</button>
<div class="hint">Haptics ramp up as the hand slides out and peak the instant it touches the white. Requires a phone with vibration support (most Android browsers; iOS Safari does not support the Vibration API).</div>
<script>
  const img = document.getElementById('anim');
  const src = img.src;
  let hapticTimers = [];
  let sustainInterval = null;

  let sustainActive = false;
  function stopSustainedHaptics() {
    if (sustainActive) {
      sustainActive = false;
      if ('vibrate' in navigator) navigator.vibrate(0);
    }
  }

  // Timeline matches the locked animation exactly:
  //   0ms          -> hold, hand hidden behind wall
  //   720ms         -> slide begins
  //   2330ms        -> hand fully reaches the white (touch point)
  //   2330-2780ms   -> visual shake plays out
  // Haptic pulses ramp up in strength (pulse duration) and frequency (shrinking gaps) across the
  // slide, then fire one strong final burst right at the touch point.
  function runHaptics() {
    hapticTimers.forEach(clearTimeout);
    hapticTimers = [];
    if (!('vibrate' in navigator)) return;

    const slideStart = 720;
    const slideEnd = 2330;
    const slideDuration = slideEnd - slideStart;
    const steps = 14;

    for (let i = 0; i <= steps; i++) {
      const t = i / steps; // 0..1 progress through the slide
      const delay = slideStart + t * slideDuration;
      const pulseLen = Math.round(8 + t * 30); // grows from 8ms to 38ms
      hapticTimers.push(setTimeout(() => navigator.vibrate(pulseLen), delay));
    }

    // maximum burst right as it touches the white
    hapticTimers.push(setTimeout(() => navigator.vibrate([70, 30, 90, 20, 60]), slideEnd));

    // then hold one steady, continuous vibration until the user touches the hand.
    // navigator.vibrate() can't run forever in a single call, so we re-issue it back-to-back
    // with no gap between calls, which reads as one unbroken buzz rather than a pulse.
    hapticTimers.push(setTimeout(() => {
      sustainActive = true;
      const holdChunk = 10000; // reissue every 10s, well before any browser cap
      function keepAlive() {
        if (!sustainActive) return;
        navigator.vibrate(holdChunk);
        hapticTimers.push(setTimeout(keepAlive, holdChunk - 50));
      }
      keepAlive();
    }, slideEnd + 260));
  }

  document.getElementById('resetBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    stopSustainedHaptics();
    img.src = '';
    void img.offsetWidth;
    img.src = src;
    runHaptics();
  });

  // stop the sustained haptics only when the user touches the HAND itself (the right ~49% of the
  // image, past the wall edge) rather than anywhere on screen
  const wallEdgeFraction = 598 / 1168;
  function isTouchOnHand(clientX) {
    const rect = img.getBoundingClientRect();
    const relX = (clientX - rect.left) / rect.width;
    return relX > wallEdgeFraction;
  }
  // use pointerdown (covers touch, mouse, pen in one event, more reliable on mobile than
  // click/touchstart alone) on the whole frame container, then check the x position
  const frameEl = document.querySelector('.frame');
  frameEl.addEventListener('pointerdown', function (e) {
    if (isTouchOnHand(e.clientX)) stopSustainedHaptics();
  });
  // fallbacks in case pointer events aren't supported
  frameEl.addEventListener('touchstart', function (e) {
    const t = e.changedTouches && e.changedTouches[0];
    if (t && isTouchOnHand(t.clientX)) stopSustainedHaptics();
  }, { passive: true });
  frameEl.addEventListener('click', function (e) {
    if (isTouchOnHand(e.clientX)) stopSustainedHaptics();
  });

  // run once on load too
  runHaptics();
</script>
