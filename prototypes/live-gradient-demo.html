<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>INVOICE — Live Gradient Motion (Layers, not video)</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #000;
    height: 300vh; /* tall scroll track so scroll position drives the gradient */
  }
  #stage {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  pre#art {
    color: #a8a8a8;
    font-size: 7.5px;
    line-height: 7.5px;
    white-space: pre;
    margin: 0;
    text-shadow: 0 0 3px rgba(168,168,168,0.2);
  }
  .label {
    position: fixed;
    top: 18px; left: 18px;
    font-size: 11px; letter-spacing: 2px; color: #555;
    text-transform: uppercase;
    z-index: 5;
  }
  .lum {
    position: fixed;
    top: 18px; right: 18px;
    font-size: 11px; color: #7fffb0; z-index: 5;
  }
  canvas { display: none; }
</style>
</head>
<body>
<div class="label">SCROLL &mdash; LIVE COMPOSITED, NOT PRE-BAKED FRAMES (reference textures only)</div>
<div class="lum" id="lum">lum: 0.0</div>
<div id="stage"><pre id="art"></pre></div>
<canvas id="cv"></canvas>
<script>
const COLS = 70, ROWS = 45;
const chars = " .:-=+*#%@";
const cv = document.getElementById('cv');
cv.width = COLS; cv.height = ROWS;
const ctx = cv.getContext('2d', { willReadFrequently: true });
const artEl = document.getElementById('art');
const lumEl = document.getElementById('lum');

const img1 = new Image();
const img2 = new Image();
let loaded = 0;
function ready() {
  loaded++;
  if (loaded === 2) render();
}
img1.onload = ready;
img2.onload = ready;
img1.src = 'REF_IMG1_DATAURI';
img2.src = 'REF_IMG2_DATAURI';

function scrollFraction() {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  return h > 0 ? Math.min(1, Math.max(0, window.scrollY / h)) : 0;
}

function render() {
  const t = scrollFraction();
  // screen/additive compositing driven continuously by scroll, not 8 fixed frames
  const k1 = 0.65 * t;
  const k2 = 0.42 * Math.max(0, t - 0.15) / 0.85;

  ctx.clearRect(0, 0, COLS, ROWS);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, COLS, ROWS);

  ctx.globalAlpha = k1;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(img1, 0, 0, COLS, ROWS);

  ctx.globalAlpha = k2;
  ctx.drawImage(img2, 0, 0, COLS, ROWS);

  ctx.globalAlpha = 1;
  const data = ctx.getImageData(0, 0, COLS, ROWS).data;

  let out = '';
  let sum = 0;
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = (y * COLS + x) * 4;
      const lum = (data[i] + data[i+1] + data[i+2]) / 3 / 255;
      sum += lum;
      const idx = Math.min(chars.length - 1, Math.floor(lum * chars.length));
      out += chars[idx];
    }
    out += '\n';
  }
  artEl.textContent = out;
  lumEl.textContent = 'lum: ' + (sum / (COLS*ROWS) * 255).toFixed(1) + '  scroll: ' + (t*100).toFixed(0) + '%';

  requestAnimationFrame(render);
}

window.addEventListener('scroll', () => {}, { passive: true });
</script>
</body>
</html>
