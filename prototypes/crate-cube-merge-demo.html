let texReady = false;
let texData = null;
const TEX_SIZE = 64;
texImg.onload = () => {
  const c = document.getElementById('texcanvas');
  c.width = TEX_SIZE; c.height = TEX_SIZE;
  const cx = c.getContext('2d');
  cx.drawImage(texImg, 0, 0, TEX_SIZE, TEX_SIZE);
  texData = cx.getImageData(0, 0, TEX_SIZE, TEX_SIZE).data;
  texReady = true;
};

function sampleTexture(u, v) {
  // u, v in [-1, 1] (face-local coords) -> texture luminance 0..1
  if (!texReady) return 0;
  const tx = Math.min(TEX_SIZE-1, Math.max(0, Math.floor((u*0.5+0.5) * TEX_SIZE)));
  const ty = Math.min(TEX_SIZE-1, Math.max(0, Math.floor((v*0.5+0.5) * TEX_SIZE)));
  const i = (ty*TEX_SIZE+tx)*4;
  return (texData[i]+texData[i+1]+texData[i+2]) / 3 / 255;
}

let A=0,B=0,C=0;
const cubeWidth=12, distanceFromCam=60, K1=40, incrementSpeed=0.55;
let t = 0; // 0 = pure procedural geometry, 1 = full crate texture. Oscillates.

function calcX(i,j,k){return j*Math.sin(A)*Math.sin(B)*Math.cos(C)-k*Math.cos(A)*Math.sin(B)*Math.cos(C)+j*Math.cos(A)*Math.sin(C)+k*Math.sin(A)*Math.sin(C)+i*Math.cos(B)*Math.cos(C);}
function calcY(i,j,k){return j*Math.cos(A)*Math.cos(C)+k*Math.sin(A)*Math.cos(C)-j*Math.sin(A)*Math.sin(B)*Math.sin(C)+k*Math.cos(A)*Math.sin(B)*Math.sin(C)-i*Math.cos(B)*Math.sin(C);}
function calcZ(i,j,k){return j*Math.sin(A)*Math.cos(B)-k*Math.cos(A)*Math.cos(B)+i*Math.sin(B);}

function project(cubeX,cubeY,cubeZ, faceDensity, u, v, buffer, zBuffer){
  // Orthographic projection: no depth-division, so rotated faces stay true
  // parallelograms (straight, parallel edges) instead of keystoning into
  // trapezoids the way perspective (1/z) projection does.
  const x=calcX(cubeX,cubeY,cubeZ), y=calcY(cubeX,cubeY,cubeZ), z=calcZ(cubeX,cubeY,cubeZ);
  const depth=z+distanceFromCam; // kept only for z-buffer face priority, not for position
  const ORTHO_SCALE = 0.85;
  const xp=Math.floor(WIDTH/2 + ORTHO_SCALE*x*2);
  const yp=Math.floor(HEIGHT/2 + ORTHO_SCALE*y);
  const idx=xp+yp*WIDTH;
  if(idx>=0 && idx<WIDTH*HEIGHT && depth>zBuffer[idx]){
    zBuffer[idx]=depth;
    // blend pure-geometry density against sampled crate texture luminance by t
    const texLum = sampleTexture(u, v);
    const blended = faceDensity*(1-t) + texLum*t;
    const ci = Math.min(chars.length-1, Math.max(0, Math.floor(blended*chars.length)));
    buffer[idx]=chars[ci];
  }
}

function frame(){
  const buffer=new Array(WIDTH*HEIGHT).fill(' ');
  const zBuffer=new Array(WIDTH*HEIGHT).fill(0);

  for(let cx=-cubeWidth; cx<cubeWidth; cx+=incrementSpeed){
    for(let cy=-cubeWidth; cy<cubeWidth; cy+=incrementSpeed){
      const u = cx/cubeWidth, v = cy/cubeWidth;
      project(cx,cy,-cubeWidth, 0.35, u, v, buffer, zBuffer);
      project(cubeWidth,cy,cx,  0.65, u, v, buffer, zBuffer);
      project(-cubeWidth,cy,-cx,0.25, u, v, buffer, zBuffer);
      project(-cx,cy,cubeWidth, 0.55, u, v, buffer, zBuffer);
      project(cx,-cubeWidth,-cy,0.85, u, v, buffer, zBuffer);
      project(cx,cubeWidth,cy,  0.15, u, v, buffer, zBuffer);
    }
  }

  let out='';
  for(let k=0;k<WIDTH*HEIGHT;k++){ out+=buffer[k]; if((k+1)%WIDTH===0) out+='\n'; }
  screenEl.textContent=out;

  A+=0.025; B+=0.012; C+=0.017;
  t = (Math.sin(Date.now()/4000) + 1) / 2; // cube<->crate merge gradient (fast cycle)
  tlabel.textContent = 't: ' + t.toFixed(2) + (t < 0.15 ? ' (pure cube)' : t > 0.85 ? ' (pure crate)' : ' (merging)');

  // Independent background gradient: its own slow black->grey wash, separate
  // system from the cube/crate merge above (matches the book's page-level
  // gradient rule, decoupled from what's happening inside the cube itself).
  const bgT = (Math.sin(Date.now()/11000 + 2) + 1) / 2; // slower, offset phase
  const bgLevel = Math.round(bgT * 26); // stays dark: 0..26, never full grey/white
  document.getElementById('bgwash').style.backgroundColor = `rgb(${bgLevel},${bgLevel},${bgLevel})`;
  document.getElementById('bglabel').textContent = 'bg: ' + bgT.toFixed(2);

  requestAnimationFrame(frame);
}
frame();
</script>
