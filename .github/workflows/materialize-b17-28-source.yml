name: Materialize b17.28 source

on:
  push:
    branches:
      - housekeeping/b17.28-source
    paths:
      - '.transport-b17.28/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: housekeeping/b17.28-source
      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-source/www
          cat .transport-b17.28/part.* > /tmp/index.html.gz.b64
          base64 -d /tmp/index.html.gz.b64 > /tmp/index.html.gz
          gzip -dc /tmp/index.html.gz > mobile-source/www/index.html
          echo 'c6aff53f498c7a1bca6f6b158ee39c585009dafee4fee30f2ab22c07a3906d3d  mobile-source/www/index.html' | sha256sum -c -
          test "$(wc -c < mobile-source/www/index.html)" = "312476"
          rm -rf .transport-b17.28
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize exact b17.28 book source'
          git push origin HEAD:housekeeping/b17.28-source
